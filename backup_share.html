<script>
var ROUTES={};
var RTCAMP={},RTOLD={};   /* [bs-v2] RTCAMP: 라우트→캠프번호, RTOLD: 개편 전 이름→단가(예전 요청 계산용) */
var CAMPC={'3':{n:'3캠프',fg:'#1565c0',bg:'#e8f2ff',bd:'#90caf9',ic:'🔵'},'6':{n:'6캠프',fg:'#e65100',bg:'#fff3e0',bd:'#ffcc80',ic:'🟠'},'8':{n:'8캠프',fg:'#2e7d32',bg:'#e8f5e9',bd:'#a5d6a7',ic:'🟢'}};
function bpCampOf(rt){if(RTCAMP[rt])return RTCAMP[rt];var p=String(rt||'').charAt(0);return p==='6'?'6':(p==='8'?'8':'3');}
function bpRtGroups(){var g={};Object.keys(ROUTES).forEach(function(rt){var c=bpCampOf(rt);(g[c]=g[c]||[]).push(rt);});return Object.keys(g).sort().map(function(c){return {camp:c,routes:g[c].sort()};});}
function bpApplyReorg(v){try{if(typeof v==='string')v=JSON.parse(v);if(!v||!Array.isArray(v.reorgs))return;
  v.reorgs.filter(function(o){return o&&o.map&&o.from&&String(o.from)<=TODAY;}).sort(function(a,b){return String(a.from)<String(b.from)?-1:1;}).forEach(function(o){
    var nr={};Object.keys(ROUTES).forEach(function(rt){var m=String(rt).match(/^(\d{3})(.*)$/);var nn=(m&&o.map[m[1]])?(o.map[m[1]]+m[2]):rt;RTOLD[rt]=ROUTES[rt];if(nr[nn]==null)nr[nn]=ROUTES[rt];});
    ROUTES=nr;
    var np=o.newPlace||{};Object.keys(np).forEach(function(k){var mm=String(np[k]||'').match(/(\d)\s*캠프/);if(mm){Object.keys(ROUTES).forEach(function(rt){if(rt.slice(0,3)===k)RTCAMP[rt]=mm[1];});}});
  });}catch(e){}}
function bpDow(ds){var p=String(ds||'').split('-');if(p.length<3)return '';return ['일','월','화','수','목','금','토'][new Date(+p[0],+p[1]-1,+p[2]).getDay()];}
function bpDateK(ds){var p=String(ds||'').split('-');if(p.length<3)return ds||'';return (+p[1])+'월 '+(+p[2])+'일 ('+bpDow(ds)+')';}
var DRIVERS=[];
var HYEONADD=200; var RATE={'특정일':{'아파트':950,'지번':1100}};
function aptUnit(mode,t){var m=RATE[mode]||RATE['특정일'];if(t==='아파트+지번')return Math.round((m['아파트']+m['지번'])/2);return m[t]||m['아파트'];}
var APTP={'아파트':950,'지번':1100,'아파트+지번':1025}, VAT=0.1, FIELD=200;
var SB_URL='https://yfqjznfuvudliazfumvp.supabase.co', SB_KEY='sb_publishable_sbSUS59jAuWUMTQJ-S8blA_tWMi6B5u';
var PUSH_URL='https://czpinyfirgvkhdfnvkls.supabase.co', PUSH_KEY='sb_publishable_pRqR_NjX5quStpY26IjHfw_YQAhtwoN';
var sb=supabase.createClient(SB_URL,SB_KEY);
var _q=new URLSearchParams(location.search);
var ME=decodeURIComponent(_q.get('name')||'정원준');
var MYCOMP=_q.get('comp')||'teamflex';
var MYCOMPNAME=decodeURIComponent(_q.get('cn')||'팀플렉스');
var ROLE=_q.get('role')||'admin';
var CANCEL_PW='';
var MYPHONE=_q.get('phone')||'';
var MYACCT='',MYBANK='',MYACCTNO='';
var APPROVED_IDS=[MYCOMP]; var IS_OWNER=false; var COMPANIES=[];
var page='cal', sub=null, curDate=null, curId=null, draft=null, filt={mine:'all',sup:'all'};
function pad(n){return ('0'+n).slice(-2);}
function kToday(){var d=new Date(Date.now()+9*3600000);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate());}
var TODAY=kToday(),CY=+TODAY.slice(0,4),CM=+TODAY.slice(5,7),TD=+TODAY.slice(8,10);
function dstr(y,m,d){return y+'-'+pad(m)+'-'+pad(d);}
function dBadge(ds){if(ds===TODAY)return '<span class="badge b-today">당일</span>';var p=ds.split('-');return '<span class="badge b-date">'+(+p[1])+'월'+(+p[2])+'일</span>';}
function isPastDate(ds){return !!ds && String(ds) < TODAY;}  // 오늘 이전 = 지난 날짜(등록/지원 불가)
function typeBadge(t){var m={'아파트':['#e3f2fd','#1565c0'],'지번':['#fff4e6','#e65100'],'아파트+지번':['#f6ecfb','#7b1fa2'],'ALL':['#e9f7ee','#2e7d32']}[t]||['#eceff1','#607d8b'];return '<span class="tbig" style="background:'+m[0]+';color:'+m[1]+'">'+t+'</span>';}
var slots=[];
// state: joined(신청)/invited(협업제안)/accepted(수락)/declined(거절)/picked(업무확정)
var reqs=[];
function money(n){return '₩'+Math.round(n||0).toLocaleString();}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},1700);}
function go(p){page=p;sub=null;['cal','mine','sup','settle'].forEach(function(x){var e=document.getElementById('n-'+x);if(e)e.classList.toggle('on',x===p);});render();}
function rAvg(rt){if(!rt.length)return 0;return Math.round(rt.reduce(function(a,r){return a+(ROUTES[r]||RTOLD[r]||800);},0)/rt.length);}
function computeUnit(r){var ex=r.extra||0,u=0;if(r.viaSupport||r.mode==='개인')u=rAvg(r.routes)+ex;else if(r.mode==='현장')u=rAvg(r.routes)+HYEONADD+ex;else if(r.mode==='특정일')u=aptUnit('특정일',r.aptType||'아파트')+ex;return Math.max(0,u);}
function reqUnit(r){if(r.negUnit)return r.negUnit;if(r.unit!=null)return r.unit;return computeUnit(r);}
/* 스캔: 원단가 제외, 추가단가만 정산 / 미스캔(기본): 원단가+추가단가 */
function payUnit(r){if(r.negUnit)return r.negUnit;return r.scan?Math.max(0,r.extra||0):reqUnit(r);}
function baseUnit(r){if(r.negUnit)return r.negUnit;return Math.max(0,reqUnit(r)-(r.extra||0));}
function scanBadge(r){if(r.negUnit)return '';return r.scan?'<span class="badge" style="background:#ede7f6;color:#5e35b1">📷 스캔</span>':'<span class="badge" style="background:#eceff1;color:#546e7a">📦 미스캔</span>';}
function reqTotal(r){var q=(r.finalQty||0),u=payUnit(r);return u*q;}
function estTotal(r){var q=(r.estQty||0),u=payUnit(r);return u*q;}
function isCash(r){return r.settle==='개인';}
function nAmt(r,a){return isCash(r)?Math.round((a||0)/1.1):(a||0);}
function vatTag(r){return isCash(r)?' <span style="font-size:10px;color:#e65100;font-weight:800">(부가세 10% 제외)</span>':' <span style="font-size:10px;color:#1565c0;font-weight:800">(부가세 포함)</span>';}
function moneyR(r,a){return money(nAmt(r,a))+vatTag(r);}

function reqCard(r){if(r.status==='done')return doneCompact(r);
  var qtyTxt=(r.finalQty?('실제 '+r.finalQty+'개'):(r.estQty?('예상 '+r.estQty+'개'):'수량 대기'))+(r.qtyNote?(' ('+r.qtyNote+')'):'');
  var pr=r.finalQty?moneyR(r,reqTotal(r)):(r.estQty?moneyR(r,estTotal(r)):moneyR(r,payUnit(r)));
  var pl=r.finalQty?'정산금':(r.estQty?'예상 정산금':'단가/개');

    +supMini(r)
    +'<div class="row" style="justify-content:space-between;margin-top:9px"><span class="meta">'+pl+'</span><span class="price">'+pr+'</span></div></div>';

function bpSetYM(ds){var p=String(ds||'').split('-');if(p.length<3)return '';var y=+p[0],m=+p[1];if(+p[2]>=26){m++;if(m>12){m=1;y++;}}return y+'-'+pad(m);}
function bpYMadd(ym,n){var y=+ym.slice(0,4),m=+ym.slice(5,7)+n;while(m>12){m-=12;y++;}while(m<1){m+=12;y--;}return y+'-'+pad(m);}
function bpYMlabel(ym){if(ym==='all')return '전체';var m=+ym.slice(5,7),pm=bpYMadd(ym,-1);return m+'월 ('+(+pm.slice(5,7))+'/26~'+m+'/25)';}
var settleScope=bpSetYM(TODAY);
function bpPrevYM(){var d=new Date(CY,CM-2,1);return d.getFullYear()+'-'+pad(d.getMonth()+1);}
function bpSettleData(scope){var inc={},exp={},tin=0,tout=0,ninc=0,nexp=0,thisYM=TODAY.slice(0,7),prevYM=bpPrevYM(),P={};
  function per(n){n=bpDisp(n);return P[n]=P[n]||{name:n,inc:0,exp:0,ni:0,ne:0,items:[]};}
  reqs.forEach(function(r){
    if(r.status!=='done'||r.settle!=='정산일')return;
    if(scope!=='all'&&bpSetYM(r.date)!==scope)return;
    var u=payUnit(r),q=r.finalQty||0,total=u*q;
    var sups=(r.supporters||[]).filter(function(s){return s.state==='picked';});if(!sups.length)sups=r.supporters||[];
    var share=sups.length?Math.round(total/sups.length):total,sq=sups.length?Math.round(q/sups.length):q;
    var rt=(r.routes||[]).join(','),how=r.negUnit?'특정 단가':(r.scan?'스캔·추가단가만':'기본'+((r.extra||0)?(' + 추가 '+money(r.extra)):''));
    sups.forEach(function(s){if(!sameCo(s.company))return;var nm=bpDisp(s.name);inc[nm]=(inc[nm]||0)+share;tin+=share;ninc++;var o=per(nm);o.inc+=share;o.ni++;o.items.push({k:'in',id:r.id,date:r.date,other:bpDisp(r.requester),route:rt,qty:sq,unit:u,amt:share,how:how});});
    if(r.requester&&(!r.company_id||r.company_id===MYCOMP)){var rn=bpDisp(r.requester);exp[rn]=(exp[rn]||0)+total;tout+=total;nexp++;var o2=per(rn);o2.exp+=total;o2.ne++;o2.items.push({k:'out',id:r.id,date:r.date,other:sups.map(function(x){return bpDisp(x.name);}).join(', '),route:rt,qty:q,unit:u,amt:total,how:how});}
  });
  Object.keys(P).forEach(function(k){P[k].items.sort(function(a,b){return a.date<b.date?-1:(a.date>b.date?1:(a.k<b.k?-1:1));});});
  return {inc:inc,exp:exp,tin:tin,tout:tout,ninc:ninc,nexp:nexp,per:P};
}

/* 요청 관련 알림: 당사자(팀플렉스 소속만 — 푸시서버가 팀플렉스용) + 관련 회사 관리자 */
function bpReqNotify(r,who,title,body){var tf=false;(who||[]).forEach(function(n){var nm=(n&&typeof n==='object')?n.name:n;var c=coOf(r,n);if(!nm)return;if(c&&!isTF(c))return;tf=true;if(nm===ME&&sameCo(c))return;bpPush(nm,title,body);});if(!tf&&r){tf=isTF(r.rcomp)||(r.supporters||[]).some(function(x){return isTF(x.company);});}if(tf)bpPushAdmins(title,body);}
function bpPushAdmins(title,body){if(!bpNotifOn())return;if(bpQuiet())return;try{fetch(PUSH_URL+'/functions/v1/send-push',{method:'POST',headers:{'Content-Type':'application/json','apikey':PUSH_KEY},body:JSON.stringify({title:'[관리자] '+title,body:body,target_roles:['admin'],data:{tag:'backup'}})}).catch(function(){});}catch(_e){}}
function bpPushMany(names,title,body){(names||[]).forEach(function(n){bpPush(n,title,body);});}
function bpBroadcast(title,body){if(!bpNotifOn())return;if(bpQuiet())return;try{fetch(PUSH_URL+'/functions/v1/send-push',{method:'POST',headers:{'Content-Type':'application/json','apikey':PUSH_KEY},body:JSON.stringify({title:title,body:body,target_roles:bpRoles(),data:{tag:'backup'}})}).catch(function(){});}catch(_e){}}
function cancelSlot(id){if(!confirm('지원 가능 등록을 취소할까요?'))return;sb.from('bp_slots').delete().eq('id',id).then(function(){reload();});toast('🗑 지원 취소됨');}
function cancelReq(id){if(!confirm('백업 요청을 취소할까요?'))return;sb.from('bp_requests').delete().eq('id',id).then(function(){reload();});sub=null;go('mine');toast('🗑 요청 취소됨');}
function startEditReq(id){var r=reqs.find(function(x){return x.id===id;});if(!r)return;draft={_editId:id,mode:r.mode,aptType:r.aptType||'아파트',routes:(r.routes||[]).slice(),_rtOpen:false,routeInfo:r.routeInfo||'',mapImg:r.mapImg||'',estQty:r.estQty||'',extra:r.extra||0,date:r.date,settle:r.settle||'정산일',acctShare:!!r.acctShare,collab:!!r.collab,collabExtra:Math.max(1,(r.needCount||1)-1),returnReq:!!r.returnReq,scan:!!r.scan,qtyNote:r.qtyNote||''};sub='register';render();}
function bpLabel(r){return '「'+((r.routes&&r.routes.join('/'))||'백업')+'」';}
function bpNotifOn(){return BPNOTIF.on!==false;}
function bpRoles(){var r={admin:1};if(BPNOTIF.gongwal||BPNOTIF.teamjang)r.leader=1;if(BPNOTIF.jojang)r.sub=1;if(BPNOTIF.gisa)r.driver=1;return Object.keys(r);}
function bpBell(){ if(typeof ROLE!=='undefined'&&ROLE==='admin'){bpOpenNotifCfg();return;} }
function bpCloseNotifCfg(){var o=document.getElementById('bp-notif-ov');if(o)o.remove();}
function bpNotifAll(v){['gongwal','teamjang','jojang','gisa'].forEach(function(k){var e=document.getElementById('bpn-'+k);if(e)e.checked=v;});}
function bpSaveNotif(){BPNOTIF.on=document.getElementById('bpn-on').checked;['gongwal','teamjang','jojang','gisa'].forEach(function(k){var e=document.getElementById('bpn-'+k);BPNOTIF[k]=e?e.checked:false;});sb.from('app_settings').upsert({key:'bp_notif',value:JSON.stringify(BPNOTIF)},{onConflict:'key'}).then(function(){});bpCloseNotifCfg();toast(BPNOTIF.on?'\U0001F514 알림 설정 저장':'\U0001F515 백업 알림 전체 중지');}
function bpOpenNotifCfg(){var o=document.getElementById('bp-notif-ov');if(o)o.remove();var d=document.createElement('div');d.id='bp-notif-ov';d.style.cssText='position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;justify-content:flex-end';function ck(on){return on?'checked':'';}d.innerHTML='<div onclick="bpCloseNotifCfg()" style="flex:1;background:rgba(0,0,0,.45)"></div><div style="background:#fff;border-radius:20px 20px 0 0;padding:18px 18px 28px;max-height:82vh;overflow:auto"><div style="width:40px;height:4px;background:#e0e0e0;border-radius:2px;margin:0 auto 14px"></div><div style="font-size:16px;font-weight:900;color:#123a6b;text-align:center;margin-bottom:4px">\U0001F514 백업 공유 알림 대상</div><div style="font-size:11px;color:#8090a0;text-align:center;margin-bottom:14px;line-height:1.6">등록 알림(요청·지원 가능)은 아래 체크한 역할에게 발송됩니다.<br>테스트 중에는 <b>이 탭 알림 사용</b>을 끄면 모든 백업 푸시가 중지됩니다.</div><label style="display:flex;align-items:center;gap:10px;background:#eef5ff;border-radius:11px;padding:13px;font-weight:800;color:#1565c0;margin-bottom:8px"><input type="checkbox" id="bpn-on" '+ck(BPNOTIF.on)+' style="width:20px;height:20px"> 이 탭 알림 사용</label><label style="display:flex;align-items:center;gap:10px;background:#f6f8fc;border-radius:11px;padding:12px;font-weight:800;color:#455;margin-bottom:8px"><input type="checkbox" id="bpn-all" onchange="bpNotifAll(this.checked)" style="width:20px;height:20px"> 전체 역할 선택</label>'+[['gongwal','총괄'],['teamjang','팀장'],['jojang','조장'],['gisa','기사']].map(function(x){return '<label style="display:flex;align-items:center;gap:10px;border:1px solid #eef2f6;border-radius:11px;padding:12px;font-weight:700;color:#33475b;margin-bottom:7px"><input type="checkbox" id="bpn-'+x[0]+'" '+ck(BPNOTIF[x[0]])+' style="width:20px;height:20px"> '+x[1]+'</label>';}).join('')+'<button onclick="bpSaveNotif()" style="width:100%;margin-top:10px;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,#1565c0,#0d3e80);color:#fff;font-size:15px;font-weight:900;cursor:pointer">저장</button></div>';document.body.appendChild(d);}
function bpNewReq(r){var db=reqToDb(r);sb.from('bp_requests').insert(db).then(function(res){if(res&&res.error)toast('저장오류');reload();});}
function bpSaveReq(r){sb.from('bp_requests').update(reqToDb(r)).eq('id',r.id).then(function(res){if(res&&res.error)toast('저장오류');reload();});}
function bpNewSlot(s){sb.from('bp_slots').insert({company_id:MYCOMP,driver_name:s.driver,driver_company:s.company,date:s.date,type:s.type,qty:s.qty,unit:s.unit,status:s.status||'open'}).then(function(){reload();});}
function bpSaveSlot(s){sb.from('bp_slots').update({status:s.status}).eq('id',s.id).then(function(){});}
async function loadData(){
  var _d=await Promise.all([
    sb.from('bp_requests').select('*').in('company_id',APPROVED_IDS).order('date',{ascending:true}),
    sb.from('bp_slots').select('*').in('company_id',APPROVED_IDS).order('date',{ascending:true})
  ]);
  reqs=((_d[0]&&_d[0].data)||[]).map(dbToReq);
  slots=((_d[1]&&_d[1].data)||[]).map(dbToSlot);
}
function pendingHtml(c){return '<div style="padding:34px 16px;text-align:center"><div style="font-size:46px">⏳</div><div style="font-size:17px;font-weight:900;color:#123a6b;margin-top:12px">백업 공유 · 승인 대기</div><div class="note" style="margin-top:16px">'+(c?('<b>'+(c.name||MYCOMPNAME)+'</b> 업체는 아직 <b>승인</b>되지 않았습니다.'):('<b>'+MYCOMPNAME+'</b> 업체가 허브에 <b>참여 요청</b>되었습니다.'))+'<br>팀플렉스(오너) 관리자의 승인 후 이용할 수 있습니다.</div></div>';}
async function boot(){
  try{
    var cr=await sb.from('bp_companies').select('*').eq('id',MYCOMP).maybeSingle();
    var meComp=cr&&cr.data;
    if(!meComp){ try{await sb.from('bp_companies').insert({id:MYCOMP,name:MYCOMPNAME,approved:false,active:true,contact:ME});}catch(e){} document.getElementById('scr').innerHTML=pendingHtml(null); return; }
    if(!meComp.approved && !meComp.is_owner){ document.getElementById('scr').innerHTML=pendingHtml(meComp); return; }
    IS_OWNER=!!meComp.is_owner;
    try{if(ROLE!=='admin'){['bp-bell','bp-gear'].forEach(function(id){var e=document.getElementById(id);if(e)e.style.display='none';});} var _ns=document.getElementById('n-settle');if(_ns){_ns.style.display='';if(ROLE!=='admin')_ns.innerHTML='📊 내 정산';}}catch(_e){}
    try{var _sb=document.getElementById('bp-sub');if(_sb)_sb.textContent=ME+' · '+MYCOMPNAME+' · 매칭 전 익명';}catch(_e){}
    render();
    var _R=await Promise.all([
      sb.from('bp_companies').select('id').eq('approved',true),
      sb.from('bp_company_config').select('*').eq('company_id',MYCOMP).maybeSingle(),
      sb.from('bp_company_routes').select('route_name,base_price').eq('company_id',MYCOMP),
      sb.from('bp_company_drivers').select('name,account_no,bank_name,phone').eq('company_id',MYCOMP),
      sb.from('app_settings').select('value').eq('key','feature_controls').maybeSingle(),
      sb.from('app_settings').select('value').eq('key','bp_notif').maybeSingle(),
      sb.from('bp_companies').select('*').order('requested_at',{ascending:true}),
      sb.from('app_settings').select('value').eq('key','bp_cancel_pw').maybeSingle()
    ]);
    var ap=_R[0],cf=_R[1],rt=_R[2],dv=_R[3],fc=_R[4],nf=_R[5],cs=_R[6],cpw=_R[7];
    try{if(cpw&&cpw.data&&cpw.data.value!=null){var _cv=cpw.data.value;CANCEL_PW=(typeof _cv==='string'?(function(){try{return JSON.parse(_cv);}catch(_e){return _cv;}})():_cv)||'';}}catch(_e){}
    APPROVED_IDS=((ap&&ap.data)||[]).map(function(x){return x.id;}); if(!APPROVED_IDS.length)APPROVED_IDS=[MYCOMP];
    if(cf&&cf.data){HYEONADD=cf.data.hyeon_add;RATE['특정일']['아파트']=cf.data.teuk_apt;RATE['특정일']['지번']=cf.data.teuk_jib;APTP['아파트']=cf.data.teuk_apt;APTP['지번']=cf.data.teuk_jib;APTP['아파트+지번']=Math.round((cf.data.teuk_apt+cf.data.teuk_jib)/2);}
    ROUTES={};((rt&&rt.data)||[]).forEach(function(x){ROUTES[x.route_name]=x.base_price;});
    if(MYCOMP==='teamflex'){try{var _rro=await fetch(PUSH_URL+'/rest/v1/app_settings?key=eq.route_reorg&select=value',{headers:{apikey:PUSH_KEY,Authorization:'Bearer '+PUSH_KEY}}).then(function(x){return x.json();});if(Array.isArray(_rro)&&_rro[0])bpApplyReorg(_rro[0].value);}catch(_e){}}   /* [bs-v2] 10/14 라우트 개편 반영 */
    DRIVERS=((dv&&dv.data)||[]).map(function(x){return x.name;});
    if(ROLE==='admin'&&DRIVERS.indexOf(BP_ADMIN_REAL)<0)DRIVERS.push(BP_ADMIN_REAL);
    /* 팀플렉스: 허브 명단(초기 1회 복사본)에 없는 신규 기사를 기사포털 최신 명단(승인 기사)에서 보충 — 이름·연락처만 조회 */
    if(MYCOMP==='teamflex'){try{var _pd=await fetch(PUSH_URL+'/rest/v1/drivers?select=name,phone,role,status&status=eq.approved',{headers:{apikey:PUSH_KEY,Authorization:'Bearer '+PUSH_KEY}}).then(function(x){return x.json();});if(Array.isArray(_pd)){_pd.forEach(function(x){if(!x.name||x.role==='admin')return;if(DRIVERS.indexOf(x.name)<0)DRIVERS.push(x.name);if(x.name===ME&&!MYPHONE&&x.phone)MYPHONE=x.phone;});DRIVERS.sort(function(a,b){return a.localeCompare(b,'ko');});}}catch(_e){}}
    var mine=((dv&&dv.data)||[]).find(function(x){return x.name===ME;}); if(mine){MYBANK=(mine.bank_name||'').trim();MYACCTNO=(mine.account_no||'').trim();MYACCT=(MYBANK+' '+MYACCTNO).trim();if(!MYPHONE&&mine.phone)MYPHONE=mine.phone;}
    try{if(fc&&fc.data){var _p=typeof fc.data.value==='string'?JSON.parse(fc.data.value):fc.data.value; PUSHHOURS=_p&&_p.pushHours;}}catch(_e){}
    try{if(nf&&nf.data&&nf.data.value){var np=typeof nf.data.value==='string'?JSON.parse(nf.data.value):nf.data.value; BPNOTIF=Object.assign(BPNOTIF,np);}}catch(_e){}
    COMPANIES=((cs&&cs.data)||[]);
    await loadData();
    render();
  }catch(e){document.getElementById('scr').innerHTML='<div class="note">연결 오류: '+((e&&e.message)||e)+'</div>';}
}
boot();

</script>
