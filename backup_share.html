<body>
<div class="phone">
  <div class="hdr"><div style="display:flex;align-items:center;justify-content:space-between"><div><div class="t">🤝 백업 공유</div><div class="s">정원준 · 팀플렉스 · 매칭 전 익명 · 정산 연동</div></div><div style="display:flex;gap:8px"><div onclick="bpBell()" style="cursor:pointer;font-size:16px;background:rgba(255,255,255,.2);width:40px;height:40px;border-radius:11px;display:grid;place-items:center">🔔</div><div onclick="openAdmin()" style="cursor:pointer;font-size:20px;background:rgba(255,255,255,.2);width:40px;height:40px;border-radius:11px;display:grid;place-items:center">⚙️</div></div></div></div>

<script>
var ROUTES={};
var DRIVERS=[];
var HYEONADD=200; var RATE={'특정일':{'아파트':950,'지번':1100}};
function aptUnit(mode,t){var m=RATE[mode]||RATE['특정일'];if(t==='아파트+지번')return Math.round((m['아파트']+m['지번'])/2);return m[t]||m['아파트'];}
var APTP={'아파트':950,'지번':1100,'아파트+지번':1025}, VAT=0.1, FIELD=200;
var SB_URL='https://czpinyfirgvkhdfnvkls.supabase.co', SB_KEY='sb_publishable_pRqR_NjX5quStpY26IjHfw_YQAhtwoN';
var sb=supabase.createClient(SB_URL,SB_KEY);
var _q=new URLSearchParams(location.search);
var ME=decodeURIComponent(_q.get('name')||'정원준');
var MYCOMP=_q.get('comp')||'teamflex';
var MYCOMPNAME=decodeURIComponent(_q.get('cn')||'팀플렉스');
var ROLE=_q.get('role')||'admin';
var MYPHONE=_q.get('phone')||'';
var MYACCT='';
var APPROVED_IDS=[MYCOMP]; var IS_OWNER=false; var COMPANIES=[];
var page='cal', sub=null, curDate=null, curId=null, draft=null, filt={mine:'all',sup:'all'};
function pad(n){return ('0'+n).slice(-2);}
function kToday(){var d=new Date(Date.now()+9*3600000);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate());}
var TODAY=kToday(),CY=+TODAY.slice(0,4),CM=+TODAY.slice(5,7),TD=+TODAY.slice(8,10);
function dstr(y,m,d){return y+'-'+pad(m)+'-'+pad(d);}
function dBadge(ds){if(ds===TODAY)return '<span class="badge b-today">당일</span>';var p=ds.split('-');return '<span class="badge b-date">'+(+p[1])+'월'+(+p[2])+'일</span>';}
function typeBadge(t){var m={'아파트':['#e3f2fd','#1565c0'],'지번':['#fff4e6','#e65100'],'아파트+지번':['#f6ecfb','#7b1fa2'],'ALL':['#e9f7ee','#2e7d32']}[t]||['#eceff1','#607d8b'];return '<span class="tbig" style="background:'+m[0]+';color:'+m[1]+'">'+t+'</span>';}
var slots=[];
// state: joined(신청)/invited(협업제안)/accepted(수락)/declined(거절)/picked(업무확정)
var reqs=[];
function money(n){return '₩'+Math.round(n||0).toLocaleString();}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},1700);}
function go(p){page=p;sub=null;['cal','mine','sup'].forEach(function(x){document.getElementById('n-'+x).classList.toggle('on',x===p);});render();}
function rAvg(rt){if(!rt.length)return 0;return Math.round(rt.reduce(function(a,r){return a+(ROUTES[r]||800);},0)/rt.length);}
function computeUnit(r){var ex=r.extra||0;if(r.viaSupport||r.mode==='개인')return rAvg(r.routes)+ex;if(r.mode==='현장')return rAvg(r.routes)+HYEONADD+ex;if(r.mode==='특정일')return aptUnit('특정일',r.aptType||'아파트')+ex;return 0;}
function reqUnit(r){if(r.negUnit)return r.negUnit;if(r.unit!=null)return r.unit;return computeUnit(r);}
function reqTotal(r){var q=(r.finalQty||0),u=reqUnit(r);return u*q;}
function estTotal(r){var q=(r.estQty||0),u=reqUnit(r);return u*q;}
function modeBadge(m){return {'현장':'<span class="badge b-orange">현장</span>','특정일':'<span class="badge b-blue">특정일</span>','개인':'<span class="badge b-purple">개인협업</span>'}[m];}
function kindBadge(r){return r.viaSupport?'<span class="badge b-teal">🔁 역지원</span>':(modeBadge(r.mode)+(r.mode==='특정일'?typeBadge(r.aptType):''));}
function stBadge(s){return {open:'<span class="badge b-blue">🔵 대기</span>',collabreq:'<span class="badge b-indigo">👥 협업제안</span>',nego:'<span class="badge b-cyan">🤝 매칭협상</span>',matched:'<span class="badge b-amber">🟠 진행중</span>',qty:'<span class="badge b-purple">🟣 수량확인</span>',confirm:'<span class="badge b-yellow">🟡 확정요청</span>',done:'<span class="badge b-green">✅ 완료</span>'}[s];}
function comp(c){return c!==MYCOMPNAME?('<span class="badge b-purple">'+c+'</span>'):'<span class="badge b-blue">팀플렉스</span>';}
function settleBadge(r){return r.settle==='개인'?'<span class="badge b-amber">💵 개인정산</span>':'<span class="badge b-gray">📅 정산일정산</span>';}
function collabBadge(r){return r.collab?('<span class="badge b-collab">👥 협업 +'+((r.needCount||1)-1)+'</span>'):'';}
function iAmSup(r){return (r.supporters||[]).some(function(s){return s.name===ME;});}
var LOCK='<div class="lock">🔒 매칭 확정 후에는 포기·취소가 불가합니다. 확정 후 취소는 <b>상호 협의 후 관리자를 통해</b>서만 가능합니다.</div>';
function stateBadge(st){return {joined:'<span class="badge b-amber">신청</span>',invited:'<span class="badge b-indigo">협업제안</span>',accepted:'<span class="badge b-green">수락</span>',declined:'<span class="badge b-gray">거절</span>',picked:'<span class="badge b-green">업무확정</span>'}[st]||'<span class="badge b-gray">-</span>';}

function render(){var s=document.getElementById('scr');
  if(sub==='admin')return s.innerHTML=adminHtml();
  if(sub==='compadmin')return s.innerHTML=compAdminHtml();
  if(sub==='availReg')return s.innerHTML=availRegHtml();
  if(sub==='register')return s.innerHTML=registerHtml();
  if(sub==='supReg')return s.innerHTML=supRegHtml();
  if(sub==='match')return s.innerHTML=matchHtml();
  if(sub==='detail')return s.innerHTML=detailHtml(reqs.find(function(x){return x.id===curId;}));
  if(sub==='day')return s.innerHTML=dayHtml();
  if(page==='cal')return s.innerHTML=calHtml();
  if(page==='mine')return s.innerHTML=listHtml('mine');
  if(page==='sup')return s.innerHTML=listHtml('sup');
}
// ── 달력 ──
function calHtml(){
  var first=new Date(CY,CM-1,1),startW=first.getDay(),days=new Date(CY,CM,0).getDate();
  var h='<div class="note"><b style="color:#7b1fa2">■</b> 요청(보라 배경) · <b style="color:#d4a800">◎</b> 지원가능(금색 회전 테두리). 날짜를 눌러 상세/등록.</div>';
  h+='<div class="cal"><div class="caltop"><b>'+CY+'년 '+CM+'월</b></div>';
  h+='<div class="cw">'+['일','월','화','수','목','금','토'].map(function(w,i){return '<div style="color:'+(i===0?'#e53935':(i===6?'#1565c0':'#33475b'))+'">'+w+'</div>';}).join('')+'</div><div class="cg">';
  for(var p=0;p<startW;p++)h+='<div></div>';
  for(var d=1;d<=days;d++){var ds=dstr(CY,CM,d);var td=ds===TODAY;
    var spq=reqs.filter(function(r){return r.mode==='특정일'&&r.date===ds;});
    var av=slots.filter(function(x){return x.date===ds;}).length;
    var chips=spq.slice(0,2).map(function(r){return '<div class="cq" onclick="event.stopPropagation();openDetail('+r.id+')">'+r.requester+'</div>';}).join('');
    if(spq.length>2)chips+='<div class="cq" style="background:#eee;color:#666">+'+(spq.length-2)+'</div>';
    h+='<div class="cell'+(td?' td':'')+(av?' hasav':'')+(spq.length?' hasreq':'')+'" onclick="openDay(\''+ds+'\')"><div class="n" style="color:'+(td?'#e65100':'#33475b')+'">'+d+'</div>'+chips+(av?'<div class="cav">지원 '+av+'</div>':'')+'</div>';
  }
  h+='</div></div>';
  h+='<div style="margin:14px 0"><button class="btn b1" onclick="startRegister()">＋ 백업 요청 등록</button></div>';
  var tf=reqs.filter(function(r){return r.mode==='현장'&&r.date===TODAY&&r.status==='open';});
  h+='<div style="font-size:13px;font-weight:900;color:#0d3b66;margin:6px 2px 9px">🔥 오늘 현장 백업 요청 <span class="badge b-orange">'+tf.length+'</span></div>';
  if(!tf.length)h+='<div class="note">없음</div>';
  tf.forEach(function(r){h+=reqCard(r);});
  return h;
}

// ── 카드 ──
function sortByDate(a,b){return a.date<b.date?-1:(a.date>b.date?1:0);}
function doneCompact(r){return '<div class="card req done" onclick="openDetail('+r.id+')"><div class="dcompact"><span class="badge b-green">✅ 완료</span>'+dBadge(r.date)+'<span style="flex:1"></span><span class="price" style="font-size:15px">'+money(reqTotal(r))+'</span><span style="color:#c5cad2;font-weight:900;font-size:18px">›</span></div></div>';}
function supMini(r){if(!r.supporters||!r.supporters.length)return '';return '<div class="row" style="gap:5px;margin-top:7px">'+r.supporters.map(function(s,i){var c=(s.state==='picked'||s.state==='accepted')?'b-green':(s.state==='declined'?'b-gray':'b-amber');return '<span class="badge '+c+'">지원자 '+(i+1)+'</span>';}).join('')+'</div>';}
function reqCard(r){if(r.status==='done')return doneCompact(r);
  var qtyTxt=r.finalQty?('실제 '+r.finalQty+'개'):(r.estQty?('예상 '+r.estQty+'개'):'수량 대기');
  var pr=r.finalQty?money(reqTotal(r)):(r.estQty?money(estTotal(r)):money(reqUnit(r)));
  var pl=r.finalQty?'정산금':(r.estQty?'예상 정산금':'단가/개');
  return '<div class="card req '+r.status+'" onclick="openDetail('+r.id+')"><div class="row" style="margin-bottom:7px">'+dBadge(r.date)+stBadge(r.status)+kindBadge(r)+comp(r.rcomp)+collabBadge(r)+settleBadge(r)+'</div>'
    +'<div class="rname">'+r.requester+'</div>'
    +'<div class="meta">라우트 '+r.routes.join(', ')+' · '+qtyTxt+(r.mapImg?' · 🗺️지도':'')+'</div>'
    +supMini(r)
    +'<div class="row" style="justify-content:space-between;margin-top:9px"><span class="meta">'+pl+'</span><span class="price">'+pr+'</span></div></div>';
}
function listHtml(which){var arr=which==='mine'?reqs.filter(function(r){return r.requester===ME;}):reqs.filter(function(r){return iAmSup(r);});
  var f=filt[which];var flt=arr.filter(function(r){return f==='all'?true:(f==='ing'?r.status!=='done':r.status==='done');}).sort(sortByDate);
  var doneArr=arr.filter(function(r){return r.status==='done';}),ingArr=arr.filter(function(r){return r.status!=='done';});
  var total=doneArr.reduce(function(a,r){return a+reqTotal(r);},0);

  if(which==='sup')h+='<div style="margin-bottom:11px"><button class="btn b2" onclick="startSupReg()">＋ 요청 없이 지원 등록 (역지원 → 확정 요청)</button></div>';
  h+='<div class="note">'+(which==='mine'?'내가 <b>백업을 요청</b>한 건 + 나에게 온 <b>확정 요청</b>.':'내가 <b>지원·협상·협업제안</b> 받은 건. 개인협업은 완료건이 합산 반영돼요.')+'</div>';
  h+='<div style="margin:4px 0 6px">'+['all','ing','done'].map(function(k){var l={all:'전체',ing:'진행중',done:'완료·확정'}[k];return '<span class="fchip '+(f===k?'on':'')+'" onclick="filt[\''+which+'\']=\''+k+'\';render()">'+l+'</span>';}).join('')+'</div>';
  if(!flt.length)h+='<div class="note">해당 없음</div>';
  flt.forEach(function(r){if(r.status==='done'){h+=doneCompact(r);return;}h+=reqCard(r);});
  return h;

    else if(iSup)h+='<div class="note">📤 <b>'+r.requester+'</b> 기사에게 확정 요청 전송됨 · 상대 확정 대기.</div>';
  }
  else if(r.status==='matched'){if(iSup)h+='<div class="note">협업 진행 중. 완료 후 <b>실제 수량</b>을 입력하세요.</div><button class="btn b-warn" onclick="enterQty('+r.id+')">📦 실제 수량 입력·제출</button>';else if(iReq)h+='<div class="note">지원 기사 <b>실제 수량 제출 대기</b> 중입니다.</div>';h+=LOCK;}
  else if(r.status==='qty'){if(iReq)h+='<div class="card"><div class="kv"><span>제출 실제 수량</span><b>'+r.finalQty+'개</b></div><div class="kv" style="border:none"><span>정산금</span><b class="price">'+money(reqTotal(r))+'</b></div></div><button class="btn b2" onclick="confirmDone('+r.id+')">✅ 수량 확인 · 최종 확정</button>';else if(iSup)h+='<div class="note">수량 제출 완료 · 등록기사 최종 확정 대기.</div>';h+=LOCK;}
  else if(r.status==='done'){h+='<div class="card" style="border-left:5px solid #2e7d32"><div class="row"><span class="badge b-green">✅ 완료·정산 확정</span></div><div class="kv" style="margin-top:6px"><span>최종 수량</span><b>'+r.finalQty+'개</b></div><div class="kv"><span>정산 방식</span><b>'+(r.settle==='개인'?'개인 정산':'정산일 정산')+'</b></div><div class="kv" style="border:none"><span>정산금</span><b class="price">'+money(reqTotal(r))+'</b></div></div>'+LOCK;}
  return h;
}
function applyReq(id){var r=reqs.find(function(x){return x.id===id;});r.supporters=r.supporters||[];r.supporters.push({name:ME,company:MYCOMPNAME,phone:MYPHONE,acct:MYACCT,state:'joined'});bpSaveReq(r);bpPush(r.requester,'🤝 백업 지원 신청',ME+'님이 '+bpLabel(r)+'에 지원 신청했습니다.');toast('✋ 지원 신청 · 등록기사 확정 대기');render();}
function pickOne(id,i){var r=reqs.find(function(x){return x.id===id;});r.supporters=[Object.assign(r.supporters[i],{state:'picked'})];r.collab=false;r.needCount=1;r.status='matched';bpSaveReq(r);bpPush(r.supporters[0].name,'✅ 업무 확정',bpLabel(r)+' 업무가 확정되었습니다.');toast('✅ '+r.supporters[0].name+' 업무 확정 · 매칭 완료');render();}
function dropSup(id,i){var r=reqs.find(function(x){return x.id===id;});var nm=r.supporters[i].name;r.supporters.splice(i,1);bpSaveReq(r);toast('✖ '+nm+' 포기');render();}
function leaveSup(id){var r=reqs.find(function(x){return x.id===id;});r.supporters=r.supporters.filter(function(s){return s.name!==ME;});bpSaveReq(r);toast('🚪 지원 취소');render();}
function proposeCollab(id){var r=reqs.find(function(x){return x.id===id;});r.supporters.forEach(function(s){s.state='invited';});r.status='collabreq';bpSaveReq(r);bpPushMany(r.supporters.map(function(s){return s.name;}),'👥 협업 제안',ME+'님이 '+bpLabel(r)+' 협업을 제안했습니다. 수락/거절해 주세요.');toast('👥 협업 요청 전송 · 지원자 수락 대기');render();}
function acceptCollab(id){var r=reqs.find(function(x){return x.id===id;});var s=r.supporters.find(function(x){return x.name===ME;});if(s)s.state='accepted';bpSaveReq(r);bpPush(r.requester,'🤝 협업 수락',ME+'님이 협업을 수락했습니다.');toast('🤝 협업 수락 · 상대 수락 시 협업 확정');render();}
function declineCollab(id){var r=reqs.find(function(x){return x.id===id;});var s=r.supporters.find(function(x){return x.name===ME;});if(s)s.state='declined';bpSaveReq(r);bpPush(r.requester,'✖ 협업 거절',ME+'님이 협업을 거절했습니다.');toast('✖ 협업 거절');render();}
function finalizeCollab(id){var r=reqs.find(function(x){return x.id===id;});var acc=r.supporters.filter(function(s){return s.state==='accepted';});if(!acc.length){toast('수락한 지원자가 없습니다');return;}if(acc.length>=2){r.collab=true;r.needCount=acc.length;acc.forEach(function(s){s.state='picked';});r.supporters=acc;toast('🤝 협업 확정 ('+acc.length+'명)');}else{acc[0].state='picked';r.collab=false;r.needCount=1;r.supporters=[acc[0]];toast('✅ '+acc[0].name+' 업무 확정 (수락 1명)');}r.status='matched';bpSaveReq(r);bpPushMany(r.supporters.map(function(s){return s.name;}),'🤝 매칭 확정',bpLabel(r)+' 매칭이 확정되었습니다.');render();}
function confirmNego(id){var r=reqs.find(function(x){return x.id===id;});r.supporters.forEach(function(s){s.state='picked';});r.finalQty=0;r.status='matched';bpSaveReq(r);bpPush(r.requester,'✅ 협상 확정',ME+'님이 협상을 확정했습니다.');toast('✅ 협상 확정 · 진행');render();}
function rejectNego(id){var r=reqs.find(function(x){return x.id===id;});r.status='rejected';bpSaveReq(r);bpPush(r.requester,'✖ 협상 거절',ME+'님이 협상을 거절했습니다.');toast('✖ 협상 거절');go('sup');}
function confirmVia(id){var r=reqs.find(function(x){return x.id===id;});r.supporters.forEach(function(s){s.state='picked';});r.status=r.finalQty?'done':'matched';bpSaveReq(r);bpPushMany(r.supporters.map(function(s){return s.name;}),'✅ 역지원 확정',bpLabel(r)+' 역지원이 확정되었습니다.');toast('✅ 확정 · 정산 반영');render();}
function rejectVia(id){var r=reqs.find(function(x){return x.id===id;});r.status='rejected';bpSaveReq(r);bpPushMany(r.supporters.map(function(s){return s.name;}),'✖ 역지원 거절','역지원 요청이 거절되었습니다.');toast('✖ 거절 처리');go('mine');}
function enterQty(id){var r=reqs.find(function(x){return x.id===id;});var v=prompt('실제 완료 수량 입력',r.estQty||'');if(v==null)return;r.finalQty=parseInt(v||'0',10)||0;r.status='qty';bpSaveReq(r);bpPush(r.requester,'📦 수량 확인 요청',ME+'님이 수량 '+r.finalQty+'개 제출. 확인해 주세요.');toast('📦 실제 수량 제출 · 등록기사 확인 대기');render();}
function confirmDone(id){var r=reqs.find(function(x){return x.id===id;});r.status='done';bpSaveReq(r);bpPushMany(r.supporters.map(function(s){return s.name;}),'✅ 정산 확정',bpLabel(r)+' 정산이 확정되었습니다.');toast('✅ 최종 확정 · 정산 반영');render();}

// ── 허브 연동 데이터 레이어 ──
function dbToReq(x){return {id:x.id,requester:x.requester,rcomp:x.rcomp,rphone:x.rphone,date:x.date,mode:x.mode,aptType:x.apt_type,routes:x.routes||[],routeInfo:x.route_info||'',mapImg:x.map_img||'',estQty:x.est_qty,finalQty:x.final_qty,extra:x.extra||0,settle:x.settle,acctShare:x.acct_share,collab:x.collab,needCount:x.need_count||1,negUnit:x.neg_unit,negBy:x.neg_by,viaSupport:x.via_support,status:x.status,supporters:x.supporters||[],unit:x.unit,company_id:x.company_id};}
function dbToSlot(x){return {id:x.id,driver:x.driver_name,company:x.driver_company,date:x.date,type:x.type,qty:x.qty,unit:x.unit,status:x.status,company_id:x.company_id};}
function reqToDb(r){return {company_id:r.company_id||MYCOMP,requester:r.requester,rcomp:r.rcomp,rphone:r.rphone,date:r.date,mode:r.mode,apt_type:r.aptType||null,routes:r.routes||[],route_info:r.routeInfo||'',map_img:r.mapImg||'',est_qty:r.estQty||null,final_qty:r.finalQty||null,extra:r.extra||0,settle:r.settle,acct_share:!!r.acctShare,collab:!!r.collab,need_count:r.needCount||1,neg_unit:r.negUnit||null,neg_by:r.negBy||null,via_support:!!r.viaSupport,status:r.status,supporters:r.supporters||[],unit:r.unit||null,updated_at:new Date().toISOString()};}
function reload(){loadData().then(function(){render();});}
var PUSHHOURS=null;
function bpQuiet(){try{if(!PUSHHOURS)return false;var d=new Date(Date.now()+9*3600000);var hm=('0'+d.getUTCHours()).slice(-2)+':'+('0'+d.getUTCMinutes()).slice(-2);var st=PUSHHOURS.start||'22:00',e=PUSHHOURS.end||'07:00';return st<=e?(hm>=st&&hm<e):(hm>=st||hm<e);}catch(_e){return false;}}
function bpPush(name,title,body){if(!name)return;if(bpQuiet()&&name!=='문지영')return;try{fetch(SB_URL+'/functions/v1/send-push',{method:'POST',headers:{'Content-Type':'application/json','apikey':SB_KEY},body:JSON.stringify({title:title,body:body,target_name:name,data:{tag:'backup'}})}).catch(function(){});}catch(_e){}}
function bpPushMany(names,title,body){(names||[]).forEach(function(n){bpPush(n,title,body);});}
function bpLabel(r){return '「'+((r.routes&&r.routes.join('/'))||'백업')+'」';}
function bpBell(){alert('🔔 백업 공유 알림 안내\n\n· 백업 등록: 전체에게 목록으로 노출(푸시 없음)\n· 지원 신청 → 등록 기사에게 알림\n· 협업 제안/수락 → 해당 인원에게\n· 수량 확인 요청 → 등록 기사에게\n· 매칭·정산 확정 → 해당 인원에게\n\n푸시는 요청·확정 관련 해당 인원에게만 가며, 야간 시간대에는 발송되지 않습니다.');}
function bpNewReq(r){var db=reqToDb(r);sb.from('bp_requests').insert(db).then(function(res){if(res&&res.error)toast('저장오류');reload();});}
function bpSaveReq(r){sb.from('bp_requests').update(reqToDb(r)).eq('id',r.id).then(function(res){if(res&&res.error)toast('저장오류');reload();});}
function bpNewSlot(s){sb.from('bp_slots').insert({company_id:MYCOMP,driver_name:s.driver,driver_company:s.company,date:s.date,type:s.type,qty:s.qty,unit:s.unit,status:s.status||'open'}).then(function(){reload();});}
function bpSaveSlot(s){sb.from('bp_slots').update({status:s.status}).eq('id',s.id).then(function(){});}
async function loadData(){
  var rq=await sb.from('bp_requests').select('*').in('company_id',APPROVED_IDS).order('date',{ascending:true});
  reqs=((rq&&rq.data)||[]).map(dbToReq);
  var sl=await sb.from('bp_slots').select('*').in('company_id',APPROVED_IDS).order('date',{ascending:true});
  slots=((sl&&sl.data)||[]).map(dbToSlot);
}
function pendingHtml(c){return '<div style="padding:34px 16px;text-align:center"><div style="font-size:46px">⏳</div><div style="font-size:17px;font-weight:900;color:#123a6b;margin-top:12px">백업 공유 · 승인 대기</div><div class="note" style="margin-top:16px">'+(c?('<b>'+(c.name||MYCOMPNAME)+'</b> 업체는 아직 <b>승인</b>되지 않았습니다.'):('<b>'+MYCOMPNAME+'</b> 업체가 허브에 <b>참여 요청</b>되었습니다.'))+'<br>팀플렉스(오너) 관리자의 승인 후 이용할 수 있습니다.</div></div>';}
async function boot(){
  try{
    var cr=await sb.from('bp_companies').select('*').eq('id',MYCOMP).maybeSingle();
    var meComp=cr&&cr.data;
    if(!meComp){ try{await sb.from('bp_companies').insert({id:MYCOMP,name:MYCOMPNAME,approved:false,active:true,contact:ME});}catch(e){} document.getElementById('scr').innerHTML=pendingHtml(null); return; }
    if(!meComp.approved && !meComp.is_owner){ document.getElementById('scr').innerHTML=pendingHtml(meComp); return; }
    var ap=await sb.from('bp_companies').select('id').eq('approved',true);
    APPROVED_IDS=((ap&&ap.data)||[]).map(function(x){return x.id;}); if(!APPROVED_IDS.length)APPROVED_IDS=[MYCOMP];
    IS_OWNER=!!meComp.is_owner;
    try{var fc=await sb.from('app_settings').select('value').eq('key','feature_controls').maybeSingle(); if(fc&&fc.data){var _p=typeof fc.data.value==='string'?JSON.parse(fc.data.value):fc.data.value; PUSHHOURS=_p&&_p.pushHours;}}catch(_e){}
    var cs=await sb.from('bp_companies').select('*').order('requested_at',{ascending:true}); COMPANIES=((cs&&cs.data)||[]);
    var cf=await sb.from('bp_company_config').select('*').eq('company_id',MYCOMP).maybeSingle();
    if(cf&&cf.data){HYEONADD=cf.data.hyeon_add;RATE['특정일']['아파트']=cf.data.teuk_apt;RATE['특정일']['지번']=cf.data.teuk_jib;APTP['아파트']=cf.data.teuk_apt;APTP['지번']=cf.data.teuk_jib;APTP['아파트+지번']=Math.round((cf.data.teuk_apt+cf.data.teuk_jib)/2);}
    var rt=await sb.from('bp_company_routes').select('route_name,base_price').eq('company_id',MYCOMP);
    ROUTES={};((rt&&rt.data)||[]).forEach(function(x){ROUTES[x.route_name]=x.base_price;});
    var dv=await sb.from('bp_company_drivers').select('name,account_no,bank_name,phone').eq('company_id',MYCOMP);
    DRIVERS=((dv&&dv.data)||[]).map(function(x){return x.name;});
    var mine=((dv&&dv.data)||[]).find(function(x){return x.name===ME;}); if(mine){MYACCT=((mine.bank_name||'')+' '+(mine.account_no||'')).trim();}
    await loadData();
    render();
  }catch(e){document.getElementById('scr').innerHTML='<div class="note">연결 오류: '+((e&&e.message)||e)+'</div>';}
}
boot();

</script>
