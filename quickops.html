td{padding:10px;border-bottom:1px solid var(--line2);vertical-align:middle}tr:last-child td{border-bottom:0}

.muted{color:var(--ink3)}.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}.fld label{font-size:12px;font-weight:700;color:var(--ink2)}
.fld input,.fld select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;width:100%}

.icons{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap}

 .brand,.navh,.me{display:none}.nav{display:flex;gap:4px}.nav a{white-space:nowrap;padding:7px 10px;margin:0}.bar{position:static;padding:0 16px}.page{padding:16px 16px 50px}.g4{grid-template-columns:1fr 1fr}}

<script>
'use strict';
var SB_URL='https://czpinyfirgvkhdfnvkls.supabase.co', SB_KEY='sb_publishable_pRqR_NjX5quStpY26IjHfw_YQAhtwoN';
var sb=null, D=null, VIEW='dash', SELCO=null, LAST=0, TIMER=null, MODE=null, ME=null, SU={profiles:[],accounts:[]};
var NAV=[['dash','📊','관제'],['co','🏢','업체 관리'],['apply','📝','가입 신청'],['feat','🧩','기능 설정'],['conn','🔐','로그인 계정'],['brand','🎨','로고·아이콘'],['plan','💳','요금제'],['setl','🧾','정산 연동'],['s3','🛰️','새 감지 전환'],['log','📜','변경 기록']];
var GRP={nav:'앱 하단 탭',sub:'탭 안의 세부 기능',home:'홈 화면 기능',adm:'관리자 메뉴'};
var PAY={m:'월 결제',y:'카드 연 구독',c:'현금 1년'};
var CNAV=[['my','🏠','우리 업체'],['mconn','🔐','로그인 계정'],['mem','👥','직원·직급'],['mpw','🔑','내 비밀번호'],['mlog','📜','변경 기록']];

var STAT={applied:['가입 신청','warn'],active:['운영 중','ok'],onboarding:['도입 준비','acc'],paused:['일시 중지','warn'],ended:['해지','unk']};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function won(n){return n==null?'—':Number(n).toLocaleString('ko-KR')+'원';}
function ago(sec){if(sec==null)return '기록 없음';sec=Math.max(0,Math.round(sec));if(sec<60)return sec+'초 전';if(sec<3600)return Math.floor(sec/60)+'분 전';if(sec<86400)return Math.floor(sec/3600)+'시간 전';return Math.floor(sec/86400)+'일 전';}
function agoIso(iso){if(!iso)return null;var t=Date.parse(iso);return isNaN(t)?null:(Date.now()-t)/1000;}
function pill(cls,txt){return '<span class="pill '+cls+'"><i></i>'+esc(txt)+'</span>';}
function toast(m,bad){var t=document.getElementById('toast');t.textContent=m;t.className='toast on'+(bad?' bad':'');clearTimeout(toast._t);toast._t=setTimeout(function(){t.className='toast';},2600);}
function plan(code){return (D.plans||[]).find(function(p){return p.code===code;})||{};}
function co(id){return (D.companies||[]).find(function(c){return c.id===id;});}
function by(arr,id){return (arr||[]).filter(function(x){return x.company_id===id;});}
function fee(c){var p=plan(c.plan);if(!p.price_month)return null;if(c.pay==='y')return {total:p.price_month*p.annual_months_paid,per:'연',month:Math.round(p.price_month*p.annual_months_paid/12)};if(c.pay==='c')return {total:p.price_month*p.cash_months_paid,per:'1년',month:Math.round(p.price_month*p.cash_months_paid/12)};return {total:p.price_month,per:'월',month:p.price_month};}
async function rpc(fn,args){var r=await sb.rpc(fn,args||{});if(r.error)throw new Error(r.error.message);return r.data;}

/* ── 시작: 운영자(대표님)는 팀플 앱 관리자 로그인 그대로, 가입 업체는 QUICKOPS 아이디로 로그인 ── */
async function boot(){
 try{
  if(!window.supabase)throw new Error('lib');
  sb=window.supabase.createClient(SB_URL,SB_KEY);
  var s=await sb.auth.getSession();
  if(!s||!s.data||!s.data.session){var an=await sb.auth.signInAnonymously();if(an.error)throw an.error;}
  ME=await rpc('qo_me');
  if(!ME)return showAuth('login');
  await enter();
 }catch(e){gate('연결에 실패했어요. 잠시 후 다시 열어주세요.<br><small class="mono">'+esc(e.message)+'</small>');}
}
async function enter(){
  MODE=ME.kind;VIEW=MODE==='company'?'my':'dash';
  var h=(location.hash||'').slice(1);if(curNav().some(function(n){return n[0]===h;}))VIEW=h;
  document.getElementById('gate').classList.add('hide');document.getElementById('app').classList.remove('hide');
  document.getElementById('meName').textContent=MODE==='company'?(ME.name+' · '+(ROLE[ME.role]||'')):'운영자 (대표님)';
  document.getElementById('meOut').innerHTML=MODE==='company'?'<button class="btn sm" style="margin-top:8px;background:#1e293b;color:#e2e8f0;border-color:#334155" onclick="logout()">로그아웃</button>':'';
  document.querySelector('.brand small').textContent=MODE==='company'?(ME.company_name||''):'퀵플 자동화 관리 시스템';
  if(!(await load(true))){document.getElementById('gate').classList.remove('hide');document.getElementById('app').classList.add('hide');return gate('데이터를 불러오지 못했어요. 잠시 후 다시 열어주세요.');}
  clearInterval(TIMER);TIMER=setInterval(function(){if(!document.hidden)load(false);},20000);
  if(MODE==='company'){var idle=Date.now();['click','keydown','touchstart'].forEach(function(ev){document.addEventListener(ev,function(){idle=Date.now();},{passive:true});});setInterval(function(){if(Date.now()-idle>30*60*1000)logout('30분 동안 사용하지 않아 자동으로 로그아웃했어요');},60000);}
}
async function logout(msg){try{await rpc('qo_logout');}catch(e){}clearInterval(TIMER);MODE=null;ME=null;D=null;document.getElementById('app').classList.add('hide');document.getElementById('gate').classList.remove('hide');showAuth('login',msg);}
function gate(msg){document.getElementById('gbox').innerHTML='<div class="logo" style="margin:0 auto;width:48px;height:48px;font-size:22px">Q</div><h2>QUICKOPS</h2><p>'+msg+'</p>';}

/* ── 로그인 · 가입 신청 화면 ── */
function showAuth(tab,msg){
 var box=document.getElementById('gbox');box.className='auth';
 var h='<div class="row"><div class="logo" style="width:36px;height:36px;font-size:17px">Q</div><div><h2>QUICKOPS</h2><div class="muted" style="font-size:12px">퀵플 자동화 관리 시스템 · 가입 업체 전용</div></div></div>'+
  '<div class="tabs"><button class="'+(tab==='login'?'on':'')+'" onclick="showAuth(\'login\')">로그인</button><button class="'+(tab==='signup'?'on':'')+'" onclick="showAuth(\'signup\')">가입 신청</button></div>';
 if(tab==='login'){
  h+='<div class="grid" style="gap:10px">'+fld('아이디','<input id="l_id" autocomplete="username" onkeydown="if(event.key===\'Enter\')doLogin()">')+fld('비밀번호','<input id="l_pw" type="password" autocomplete="current-password" onkeydown="if(event.key===\'Enter\')doLogin()">')+
   '<button class="btn pri" style="padding:11px" onclick="doLogin()">로그인</button><div class="err" id="l_err">'+esc(msg||'')+'</div>'+
   '<div class="help" style="margin:0">• 가입 신청 후 <b>운영팀 승인</b>이 나야 로그인할 수 있어요.<br>• 5번 틀리면 10분 동안 잠겨요. 30분 동안 사용하지 않으면 자동으로 로그아웃돼요.<br>• 비밀번호를 잊었으면 업체 대표에게(대표는 운영팀에) 재설정을 요청해주세요.</div></div>';
 }else{
  h+='<div class="fl">'+
   fld('업체명 *','<input id="s_co" placeholder="예: 소원물류">')+fld('대표자명','<input id="s_ceo">')+
   fld('신청자 이름 *','<input id="s_name">')+fld('신청자 직책 *','<select id="s_title"><option>대표</option><option>책임자</option></select>')+

   fld('기사 수','<input id="s_drv" type="number" min="0">')+fld('희망 요금제','<select id="s_plan"><option value="B">기본형</option><option value="S">표준형</option><option value="P">프리미엄</option></select>')+
   '<div class="full">'+fld('문의·요청 사항','<input id="s_memo" maxlength="300">')+'</div>'+

 if(!MEDIT&&!/^[a-z0-9][a-z0-9_.-]{3,29}$/.test(p.login_id))return toast('아이디는 영문 소문자·숫자 4~30자예요',true);

function vMpw(){return '<h1>내 비밀번호</h1><p class="subt">'+esc(ME.login_id)+' 계정의 비밀번호를 바꿔요.</p><div class="card" style="max-width:420px"><div class="grid" style="gap:10px">'+fld('지금 비밀번호','<input id="pw0" type="password" autocomplete="current-password">')+fld('새 비밀번호 (8자 이상)','<input id="pw1" type="password" autocomplete="new-password">')+fld('새 비밀번호 확인','<input id="pw2" type="password" autocomplete="new-password">')+'<button class="btn pri" onclick="chPw()">바꾸기</button></div></div>';}
async function chPw(){var a=document.getElementById('pw0').value,b=document.getElementById('pw1').value,c=document.getElementById('pw2').value;if(b.length<8)return toast('새 비밀번호는 8자 이상이에요',true);if(b!==c)return toast('새 비밀번호 확인이 달라요',true);
 try{await rpc('qo_my_change_pw',{p_old:a,p_new:b});toast('비밀번호를 바꿨어요');['pw0','pw1','pw2'].forEach(function(i){document.getElementById(i).value='';});}catch(e){toast(e.message,true);}}
function vMlog(){var h='<h1>변경 기록</h1><p class="subt">우리 업체에서 일어난 로그인·변경 기록이에요. (비밀번호는 기록되지 않아요)</p><div class="card"><div class="tw"><table><thead><tr><th>시각</th><th>누가</th><th>무엇을</th><th>내용</th></tr></thead><tbody>';
 (D.audit||[]).forEach(function(a){h+='<tr><td class="mono" style="white-space:nowrap">'+new Date(a.at).toLocaleString('ko-KR')+'</td><td>'+esc(a.actor)+'</td><td><b>'+esc(a.action)+'</b></td><td class="muted" style="word-break:break-all">'+esc(a.detail)+'</td></tr>';});

/* ── 5. 로고·아이콘 ── */
var NEWLOGO=null;
function vBrand(){
 var c=co(SELCO);if(!c)return '<h1>로고·아이콘</h1>';
 var b=by(D.branding,c.id)[0]||{};
 var h='<h1>로고·아이콘</h1><p class="subt">기사들 휴대폰 홈 화면에 보이는 <b>앱 아이콘과 이름</b>을 업체별로 정해요. 업체 대표 화면은 QUICKOPS, 기사 앱 아이콘은 각 업체 로고를 따라가요.</p>'+coTabs();
 if(c.is_owner)h+='<div class="help">팀플렉스 앱은 지금 쓰는 아이콘(tf-512.png)을 그대로 유지해요. 여기서 바꾼 값은 <b>업체별 주소(/c/업체코드/) 단계</b>에서 적용돼요.</div>';
 h+='<div class="grid g2"><div class="card"><h3>설정</h3>'+
  fld('앱 이름 (홈 화면에 보이는 이름)','<input id="b_name" value="'+esc(b.app_name||'')+'" maxlength="20" oninput="brandPreview()">')+'<div style="height:10px"></div>'+
  fld('대표 색','<div class="row"><input id="b_color" type="color" value="'+esc(b.color||'#3b5bfd')+'" style="width:60px;height:36px;padding:2px" oninput="brandPreview()"><span class="muted">상단바·버튼 색</span></div>')+'<div style="height:10px"></div>'+
  fld('로고 파일 (PNG·JPG, 정사각형 권장)','<input id="b_file" type="file" accept="image/png,image/jpeg,image/webp" onchange="brandFile(this)">')+
  '<div class="row" style="margin-top:14px"><button class="btn pri" onclick="saveBrand()">저장</button><small class="muted">아이폰 180·안드로이드 192/512 크기는 자동으로 만들어져요</small></div></div>'+
  '<div class="card"><h3>미리보기</h3><div class="icons" id="b_icons"></div><div style="height:16px"></div><div class="phone" id="b_phone"></div></div></div>';
 return h;
}
function brandSrc(){var c=co(SELCO);var b=by(D.branding,c.id)[0]||{};var lp=NEWLOGO||b.logo_path||'';if(lp&&!/^data:|^https?:|^\//.test(lp))lp='/'+lp;return lp;}
function brandPreview(){var el=document.getElementById('b_icons');if(!el)return;var c=co(SELCO);var nm=val('b_name')||c.name,col=val('b_color')||'#3b5bfd',src=brandSrc();
 var ic=function(sz,r,l){return '<div class="icn"><div class="im" style="width:'+sz+'px;height:'+sz+'px;border-radius:'+r+'px;background-color:'+esc(col)+';'+(src?'background-image:url(\''+esc(src)+'\')':'')+'">'+(src?'':esc(nm.slice(0,1)))+'</div>'+l+'</div>';};
 el.innerHTML=ic(60,14,'아이폰 180')+ic(56,28,'안드로이드 192')+ic(88,20,'설치 화면 512');
 var apps=['📞','💬','📷','🗺️','','📅','⚙️','🎵'];
 document.getElementById('b_phone').innerHTML=apps.map(function(a,i){if(i===4)return '<div class="ap"><span style="background-color:'+esc(col)+';'+(src?'background-image:url(\''+esc(src)+'\')':'')+'">'+(src?'':esc(nm.slice(0,1)))+'</span>'+esc(nm.length>7?nm.slice(0,7)+'…':nm)+'</div>';return '<div class="ap"><span>'+a+'</span>앱</div>';}).join('');}
function brandFile(inp){var f=inp.files&&inp.files[0];if(!f)return;if(f.size>8*1024*1024)return toast('8MB 이하 파일을 올려주세요',true);
 var img=new Image();img.onload=function(){var out=null;[512,384,256].some(function(S){var cv=document.createElement('canvas');cv.width=cv.height=S;var x=cv.getContext('2d');var s=Math.min(img.width,img.height);x.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,S,S);out=cv.toDataURL('image/png');return out.length<650000;});
  NEWLOGO=out;URL.revokeObjectURL(img.src);brandPreview();toast('로고를 불러왔어요. 저장을 눌러야 반영돼요');};
 img.onerror=function(){toast('이미지를 읽을 수 없어요',true);};img.src=URL.createObjectURL(f);}
async function saveBrand(){var c=co(SELCO);try{await rpc('qo_admin_set_branding',{p_company:c.id,p_app_name:val('b_name')||null,p_color:val('b_color')||null,p_logo:NEWLOGO});NEWLOGO=null;toast('저장했어요');await load(true);}catch(e){toast('저장 실패: '+e.message,true);}}

/* ── 6. 요금제 ── */
function vPlan(){
 var h='<h1>요금제</h1><p class="subt">금액을 바꾸면 업체 관리의 청구 금액이 바로 다시 계산돼요. (VAT 별도) 카드 연 구독은 <b>N개월 값으로 12개월</b>, 현금 1년도 <b>N개월 값으로 12개월</b>이에요.</p>';
 h+='<div class="grid g3">';
 (D.plans||[]).forEach(function(p){var nf=(D.features||[]).filter(function(f){return !f.is_ops&&!f.is_own&&!f.is_opt&&(f.is_lock||(plan(f.min_plan).rank||99)<=p.rank);}).length;
  var cnt=(D.companies||[]).filter(function(c){return c.plan===p.code;}).length;
  h+='<div class="card"><h3>'+esc(p.name)+'<span class="r">업체 '+cnt+'곳 · 기능 '+nf+'개</span></h3>'+
   fld('이름','<input id="p_n_'+p.code+'" value="'+esc(p.name)+'">')+'<div style="height:8px"></div>'+
   fld('월 요금 (원)','<input id="p_m_'+p.code+'" type="number" step="1000" value="'+p.price_month+'" oninput="planCalc(\''+p.code+'\')">')+'<div style="height:8px"></div>'+
   '<div class="grid g2">'+fld('카드 연 구독 (개월 값)','<input id="p_a_'+p.code+'" type="number" min="1" max="12" value="'+p.annual_months_paid+'" oninput="planCalc(\''+p.code+'\')">')+fld('현금 1년 (개월 값)','<input id="p_c_'+p.code+'" type="number" min="1" max="12" value="'+p.cash_months_paid+'" oninput="planCalc(\''+p.code+'\')">')+'</div>'+
   '<div class="help" style="margin:12px 0" id="p_calc_'+p.code+'"></div><button class="btn pri" onclick="savePlan(\''+p.code+'\')">저장</button></div>';});
 h+='</div><div class="help" style="margin-top:14px">정산 프로그램 단독: 영구 사용 50만 원 · 1주 수정 기간 · 이후 수정 1회 5만 원 · 구독 업체는 초기 세팅 무료 (엑셀 기준)</div>';
 setTimeout(function(){(D.plans||[]).forEach(function(p){planCalc(p.code);});},0);
 return h;
}
function planCalc(c){var m=+val('p_m_'+c)||0,a=+val('p_a_'+c)||0,k=+val('p_c_'+c)||0;var e=document.getElementById('p_calc_'+c);if(e)e.innerHTML='월 결제 <b>'+won(m)+'</b><br>카드 연 구독 <b>'+won(m*a)+'</b> (월 환산 '+won(Math.round(m*a/12))+')<br>현금 1년 <b>'+won(m*k)+'</b> (월 환산 '+won(Math.round(m*k/12))+')';}
async function savePlan(c){var m=parseInt(val('p_m_'+c),10),a=parseInt(val('p_a_'+c),10),k=parseInt(val('p_c_'+c),10);
 if(!(m>0)||!(a>=1&&a<=12)||!(k>=1&&k<=12))return toast('금액과 개월 수를 확인해주세요',true);
 try{await rpc('qo_admin_set_plan',{p_code:c,p_name:val('p_n_'+c),p_price:m,p_annual:a,p_cash:k});toast('요금제를 저장했어요');await load(true);}catch(e){toast('저장 실패: '+e.message,true);}}

/* ── 7. 정산 연동 ── */
function vSetl(){
 var h='<h1>정산 연동</h1><p class="subt">업체마다 정산서를 어떻게 앱에 올릴지 정해요.</p><div class="help"><b>통합 정산</b>: 하나로 통일된 정산 프로그램을 써요. 대표님이 업데이트하면 업체 PC에서 프로그램을 켤 때 자동으로 새 버전이 받아져요.<br><b>결과 파일 연동</b>: 업체가 쓰던 정산 프로그램을 그대로 쓰고, 나온 결과 엑셀만 앱에 올려요 (소원물류처럼 방식이 다른 곳 추천).<br><b>미사용</b>: 정산서 탭을 쓰지 않아요.</div>';
 h+='<div class="card"><div class="tw"><table><thead><tr><th>업체</th><th>연동 방식</th><th>정산 프로그램 라이선스</th><th>마지막 변경</th></tr></thead><tbody>';
 (D.companies||[]).forEach(function(c){var s=by(D.settlement,c.id)[0]||{mode:'none'};
  h+='<tr><td><b>'+esc(c.name)+'</b></td><td><div class="seg">'+[['builtin','통합 정산'],['file','결과 파일 연동'],['none','미사용']].map(function(m){return '<button class="'+(s.mode===m[0]?'on':'')+'" onclick="setSetl(\''+c.id+'\',\''+m[0]+'\','+(!!s.has_license)+')">'+m[1]+'</button>';}).join('')+'</div></td>'+
   '<td><label class="row"><input type="checkbox" '+(s.has_license?'checked':'')+' onchange="setSetl(\''+c.id+'\',\''+s.mode+'\',this.checked)"> 보유</label></td><td class="muted">'+(s.updated_at?new Date(s.updated_at).toLocaleString('ko-KR'):'—')+'</td></tr>';});
 return h+'</tbody></table></div></div>';
}
async function setSetl(id,mode,lic){var c=co(id);if(c.is_owner&&mode!=='builtin'&&!confirm('팀플렉스 정산 연동 방식을 바꿀까요?'))return render();
 try{await rpc('qo_admin_set_settlement',{p_company:id,p_mode:mode,p_license:lic});toast('저장했어요');await load(true);}catch(e){toast('저장 실패: '+e.message,true);}}

/* ── 8. 새 감지 전환 ── */
function vS3(){
 var hb=ndHb(),inf=(hb&&hb.info)||{},cm=inf.cmp||{};
 var h='<h1>새 감지 방식 전환</h1><p class="subt">지금 운영 감지(방을 열어서 화면을 읽는 방식) 옆에서 <b>새 방식(방을 열지 않고 글 번호로 바로 읽는 방식)</b>을 같이 돌리면서 결과를 비교하고 있어요. 새 방식은 지금 <b>읽기만</b> 해서 기사들은 아무것도 느끼지 못해요.</p>';
 h+='<div class="grid g4" style="margin-bottom:14px">'+kpi('새 방식 상태',hb?(hb.age_s<60?'🟢 작동 중':'🟡 신호 늦음'):'—','마지막 신호 '+(hb?ago(hb.age_s):'—'))+kpi('새 방식이 읽은 글',(cm.new_count!=null?cm.new_count:inf.seen||0)+'건','보는 방 '+(inf.rooms||0)+'곳')+kpi('평균 감지 속도',cm.new_avg!=null?cm.new_avg+'초':'집계 중','95%가 '+(cm.new_p95!=null?cm.new_p95+'초':'—')+' 안에 감지')+kpi('새 방식이 놓친 글',cm.prod_only_n!=null?cm.prod_only_n+'건':'집계 중','운영이 처리한 글 중 새 방식이 못 잡은 글')+'</div>';
 h+='<div class="grid g2"><div class="card"><h3>운영과 비교</h3>'+row('운영이 처리 대상으로 잡은 글 (같은 방)',cm.prod_count!=null?cm.prod_count+'건':'—')+row('둘 다 잡은 글',cm.both!=null?cm.both+'건':'—')+row('운영 평균 처리 시점',cm.prod_avg!=null?cm.prod_avg+'초':'—')+row('새 방식 평균',cm.new_avg!=null?cm.new_avg+'초':'—')+row('오류',inf.errs?pill('warn',inf.errs+'회 (자동 재시도)'):pill('ok','0'))+'<p class="muted" style="margin:10px 0 0;line-height:1.6">새 방식은 방의 <b>모든 글</b>을 읽고, 운영은 그중 <b>인입·요청처럼 처리할 글</b>만 기록해요. 그래서 중요한 건 ‘새 방식이 놓친 글 = 0건’이에요. 새 감지는 재시작하면 건수를 0부터 다시 세요.<br>비교 기준 시각 '+esc(cm.at||'—')+'</p></div>';
 h+='<div class="card"><h3>전환 순서</h3><ol class="chk" style="margin:0;padding-left:18px;line-height:1.6">'+
  '<li>✅ 새 방식 병행 시작 (읽기 전용, 시험 계정)</li>'+
    '<li>'+(hb&&hb.worker==="newdetect_tf"?'✅':'⏳')+' 팀플렉스 공식 계정으로 <b>감시하는 방 전체</b> 병행 (여전히 읽기 전용)</li>'+
  '<li>'+(cm.prod_only_n===0&&cm.both>0?'🟡 진행 중':'⏳')+' 놓친 글 0건 확인 (하루 이상)</li>'+
  '<li>⏳ 새 방식이 기사 알림·팀즈 답글 담당 → 기존 방식은 5분 간격 <b>예비</b>로 남김</li>'+
  '<li>⏳ 일주일 이상 문제없으면 기존 방식 정리</li></ol>'+
  '<div class="help" style="margin:12px 0 0">문제가 생기면 언제든 <b>기존 방식이 그대로 담당</b>하도록 되돌려요. 기존 방식은 전환이 끝날 때까지 꺼지지 않아요.</div></div></div>';
 return h;
}
