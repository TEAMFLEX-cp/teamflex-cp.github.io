<style>
:root{--bg:#f5f6f8;--panel:#fff;--line:#e5e7eb;--line2:#f0f1f4;--ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--side:#0b1220;--side2:#151e31;--acc:#3b5bfd;--accbg:#eef2ff;--ok:#12b76a;--warn:#f79009;--bad:#f04438;--unk:#98a2b3;--okbg:#ecfdf3;--warnbg:#fffaeb;--badbg:#fef3f2;--unkbg:#f2f4f7}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);font-size:13px;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit;font-size:13px}
.app{display:grid;grid-template-columns:228px 1fr;height:100vh}
.side{background:var(--side);color:#cbd5e1;display:flex;flex-direction:column;padding:16px 12px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#3b5bfd,#22d3ee);display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px}
.brand b{color:#fff;font-size:15px;letter-spacing:.3px}.brand small{display:block;color:#64748b;font-size:10.5px;font-weight:600}
.navh{font-size:10.5px;color:#475569;letter-spacing:.6px;padding:14px 10px 5px;font-weight:700}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:#94a3b8;font-weight:600;cursor:pointer;margin-bottom:1px;text-decoration:none}
.nav a:hover{background:var(--side2);color:#e2e8f0}.nav a.on{background:var(--side2);color:#fff;box-shadow:inset 2px 0 0 #3b5bfd}
.nav .ic{width:18px;text-align:center}
.nav .cnt{margin-left:auto;background:var(--bad);color:#fff;border-radius:999px;font-size:10.5px;padding:1px 7px;font-weight:800}
.me{margin-top:auto;padding:12px 10px 2px;border-top:1px solid #1e293b;color:#64748b;font-size:11px;line-height:1.6}
.me b{color:#e2e8f0;font-size:12.5px}
.main{overflow:auto;display:flex;flex-direction:column;min-width:0}
.bar{height:56px;flex-shrink:0;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 24px;position:sticky;top:0;z-index:5}
.crumb{color:var(--ink3);font-weight:600;white-space:nowrap}.crumb b{color:var(--ink)}
.live{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--ink2);font-size:12px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:p 2s infinite}.dot.off{background:var(--bad);animation:none}
@keyframes p{70%{box-shadow:0 0 0 7px rgba(18,183,106,0)}0%{box-shadow:0 0 0 0 rgba(18,183,106,.5)}}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;font-weight:700;color:var(--ink);cursor:pointer}
.btn:hover{background:#f8fafc}.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}.btn.pri:hover{background:#2f4be0}
.btn.dan{color:var(--bad);border-color:#fecdca}.btn.sm{padding:4px 9px;font-size:12px}.btn:disabled{opacity:.5;cursor:default}
.page{padding:22px 24px 60px;max-width:1500px;width:100%}
h1{font-size:20px;margin:0 0 4px;letter-spacing:-.3px}.subt{color:var(--ink2);margin:0 0 18px;line-height:1.6}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.card h3{margin:0 0 12px;font-size:14px;display:flex;align-items:center;gap:8px}.card h3 .r{margin-left:auto;font-weight:600;font-size:12px;color:var(--ink3)}
.kpi .l{color:var(--ink2);font-weight:600;font-size:12px}.kpi .v{font-size:26px;font-weight:800;margin-top:6px;letter-spacing:-.5px}.kpi .s{color:var(--ink3);font-size:11.5px;margin-top:4px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:11.5px;color:var(--ink3);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line2);vertical-align:middle}tr:last-child td{border-bottom:0}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--okbg);color:#027a48}.pill.warn{background:var(--warnbg);color:#b54708}.pill.bad{background:var(--badbg);color:#b42318}.pill.unk{background:var(--unkbg);color:#475467}.pill.acc{background:var(--accbg);color:#3538cd}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}
.st{display:flex;flex-direction:column;align-items:flex-start;gap:3px}a.btn{text-decoration:none;display:inline-block}.st small{color:var(--ink3);font-size:11px}
.muted{color:var(--ink3)}.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}.fld label{font-size:12px;font-weight:700;color:var(--ink2)}
.fld input,.fld select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;width:100%}
.fld input:focus,.fld select:focus{outline:2px solid #c7d2fe;border-color:var(--acc)}
.help{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--ink2);line-height:1.7;font-size:12.5px;margin-bottom:14px}
.help b{color:var(--ink)}.help.warn{background:var(--warnbg);border-color:#fedf89;color:#7a2e0e}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:5px 10px;font-weight:700;font-size:12px;color:var(--ink2);cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}.seg button.on{background:var(--acc);color:#fff}.seg button:disabled{cursor:default;opacity:.55}
.fgrp{font-weight:800;font-size:12px;color:var(--ink2);background:#f8fafc}
.sub td:first-child{padding-left:30px;color:var(--ink2)}
.cos{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.cos button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:700;cursor:pointer}
.cos button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:10px;font-weight:700;z-index:50;opacity:0;transition:.2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}.toast.bad{background:#b42318}
.gate{display:grid;place-items:center;height:100vh;background:var(--side);color:#cbd5e1;text-align:center;padding:20px}
.gate .box{max-width:420px}.gate h2{color:#fff;margin:14px 0 8px}.gate p{line-height:1.7}
.gate a{display:inline-block;margin-top:14px;background:var(--acc);color:#fff;text-decoration:none;padding:10px 18px;border-radius:9px;font-weight:700}
.icons{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap}
.icn{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--ink2)}
.icn .im{background:#ddd center/cover no-repeat;display:grid;place-items:center;color:#fff;font-weight:800;overflow:hidden}
.phone{width:200px;height:300px;border-radius:26px;background:linear-gradient(160deg,#1e3a8a,#0f172a);padding:26px 16px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-content:start}
.phone .ap{display:flex;flex-direction:column;align-items:center;gap:4px;color:#fff;font-size:9px;text-align:center}
.phone .ap span{width:36px;height:36px;border-radius:9px;background:rgba(255,255,255,.18) center/cover no-repeat;display:grid;place-items:center;font-weight:800}
.bar2{height:8px;border-radius:99px;background:var(--line2);overflow:hidden}.bar2 i{display:block;height:100%;background:var(--acc)}
.chk li{margin:6px 0}
.hide{display:none!important}
@media (max-width:980px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.g2{grid-template-columns:1fr}}
@media (max-width:760px){.app{grid-template-columns:1fr;height:auto}.side{position:sticky;top:0;z-index:10;flex-direction:row;overflow-x:auto;padding:8px;gap:4px}
 .brand,.navh,.me{display:none}.nav{display:flex;gap:4px}.nav a{white-space:nowrap;padding:7px 10px;margin:0}.bar{position:static;padding:0 16px}.page{padding:16px 16px 50px}.g4{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="gate" class="gate"><div class="box"><div class="logo" style="margin:0 auto;width:48px;height:48px;font-size:22px">Q</div><h2>QUICKOPS</h2><p id="gmsg">불러오는 중…</p><a id="glink" class="hide" href="/">팀플 앱 열기</a></div></div>
<div id="app" class="app hide">
 <aside class="side">
  <div class="brand"><div class="logo">Q</div><div><b>QUICKOPS</b><small>퀵플 자동화 관리 시스템</small></div></div>

 </aside>

   <div class="live"><span class="dot" id="ldot"></span><span id="ltxt">실시간 연결</span><button class="btn sm" onclick="load(true)">새로고침</button></div></div>
  <div class="page" id="page"></div>
 </main>

<script>
'use strict';
var SB_URL='https://czpinyfirgvkhdfnvkls.supabase.co', SB_KEY='sb_publishable_pRqR_NjX5quStpY26IjHfw_YQAhtwoN';
var sb=null, D=null, VIEW='dash', SELCO=null, LAST=0, TIMER=null;
var NAV=[['dash','📊','관제'],['co','🏢','업체 관리'],['feat','🧩','기능 설정'],['conn','🔐','로그인 계정'],['brand','🎨','로고·아이콘'],['plan','💳','요금제'],['setl','🧾','정산 연동'],['s3','🛰️','새 감지 전환'],['log','📜','변경 기록']];
var GRP={nav:'앱 하단 탭',sub:'탭 안의 세부 기능',home:'홈 화면 기능',adm:'관리자 메뉴'};
var PAY={m:'월 결제',y:'카드 연 구독',c:'현금 1년'};
var STAT={active:['운영 중','ok'],onboarding:['도입 준비','acc'],paused:['일시 중지','warn'],ended:['해지','unk']};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function won(n){return n==null?'—':Number(n).toLocaleString('ko-KR')+'원';}
function ago(sec){if(sec==null)return '기록 없음';sec=Math.max(0,Math.round(sec));if(sec<60)return sec+'초 전';if(sec<3600)return Math.floor(sec/60)+'분 전';if(sec<86400)return Math.floor(sec/3600)+'시간 전';return Math.floor(sec/86400)+'일 전';}
function agoIso(iso){if(!iso)return null;var t=Date.parse(iso);return isNaN(t)?null:(Date.now()-t)/1000;}
function pill(cls,txt){return '<span class="pill '+cls+'"><i></i>'+esc(txt)+'</span>';}
function toast(m,bad){var t=document.getElementById('toast');t.textContent=m;t.className='toast on'+(bad?' bad':'');clearTimeout(toast._t);toast._t=setTimeout(function(){t.className='toast';},2600);}
function plan(code){return (D.plans||[]).find(function(p){return p.code===code;})||{};}
function co(id){return (D.companies||[]).find(function(c){return c.id===id;});}
function by(arr,id){return (arr||[]).filter(function(x){return x.company_id===id;});}
function fee(c){var p=plan(c.plan);if(!p.price_month)return null;if(c.pay==='y')return {total:p.price_month*p.annual_months_paid,per:'연',month:Math.round(p.price_month*p.annual_months_paid/12)};if(c.pay==='c')return {total:p.price_month*p.cash_months_paid,per:'1년',month:Math.round(p.price_month*p.cash_months_paid/12)};return {total:p.price_month,per:'월',month:p.price_month};}
async function rpc(fn,args){var r=await sb.rpc(fn,args||{});if(r.error)throw new Error(r.error.message);return r.data;}

/* ── 시작: 팀플 앱의 관리자 로그인을 그대로 사용 (같은 주소라 별도 로그인 없음) ── */
async function boot(){
 try{
  if(!window.supabase)throw new Error('lib');
  sb=window.supabase.createClient(SB_URL,SB_KEY);
  var s=await sb.auth.getSession();
  if(!s||!s.data||!s.data.session){return gate('팀플 앱에 <b>관리자</b>로 로그인한 같은 브라우저에서 열어주세요.<br>(QUICKOPS는 앱의 관리자 로그인을 그대로 사용해요)');}
  var ok=await rpc('qo_is_admin');
  if(!ok)return gate('관리자 계정만 들어올 수 있어요.<br>팀플 앱에서 관리자로 로그인한 뒤 다시 열어주세요.');
  document.getElementById('gate').classList.add('hide');document.getElementById('app').classList.remove('hide');
  var h=(location.hash||'').slice(1);if(NAV.some(function(n){return n[0]===h;}))VIEW=h;
  if(!(await load(true))){document.getElementById('gate').classList.remove('hide');document.getElementById('app').classList.add('hide');return gate('관리 데이터를 불러오지 못했어요. 잠시 후 다시 열어주세요.');}
  TIMER=setInterval(function(){if(!document.hidden)load(false);},20000);
 }catch(e){gate('연결에 실패했어요. 잠시 후 다시 열어주세요.<br><small class="mono">'+esc(e.message)+'</small>');}
}
function gate(msg){document.getElementById('gmsg').innerHTML=msg;document.getElementById('glink').classList.remove('hide');}
window.addEventListener('hashchange',function(){var h=location.hash.slice(1);if(h&&h!==VIEW&&NAV.some(function(n){return n[0]===h;})){VIEW=h;render();}});

async function load(force){
 try{
  var d=await rpc('qo_admin_overview');D=d;LAST=Date.now();
  if(!SELCO||!co(SELCO))SELCO=(D.companies[0]||{}).id||null;
  document.getElementById('ldot').className='dot';document.getElementById('ltxt').textContent='실시간 연결 · '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  var a=document.activeElement;var typing=a&&(a.tagName==='INPUT'||a.tagName==='SELECT');
  if(force||!typing)render();else renderNav();return true;
 }catch(e){document.getElementById('ldot').className='dot off';document.getElementById('ltxt').textContent='연결 끊김 — 자동 재시도 중';if(force)toast('불러오기 실패: '+e.message,true);return false;}
}
function alerts(){var n=0;(D.companies||[]).forEach(function(c){if(c.status!=='active')return;by(D.connections,c.id).forEach(function(x){if(x.status!=='ok'&&x.status!=='none')n++;});});var p=pollerState();if(p.cls!=='ok')n++;var hb=ndHb();if(hb&&hb.age_s>120)n++;return n;}
function renderNav(){var n=alerts();document.getElementById('nav').innerHTML=NAV.map(function(x){return '<a href="#'+x[0]+'" class="'+(x[0]===VIEW?'on':'')+'"><span class="ic">'+x[1]+'</span>'+x[2]+(x[0]==='dash'&&n?'<span class="cnt">'+n+'</span>':'')+'</a>';}).join('');}
function render(){
 renderNav();
 document.getElementById('crumb').textContent=(NAV.find(function(n){return n[0]===VIEW;})||[])[2]||'';
 var me=(D.audit||[])[0];document.getElementById('meAt').textContent='데이터 '+new Date(D.now).toLocaleString('ko-KR');
 var f={dash:vDash,co:vCo,feat:vFeat,conn:vConn,brand:vBrand,plan:vPlan,setl:vSetl,s3:vS3,log:vLog}[VIEW]||vDash;
 var y=document.querySelector('.main').scrollTop;
 document.getElementById('page').innerHTML=f();
 document.querySelector('.main').scrollTop=y;
 if(VIEW==='brand')brandPreview();
}

/* ── 상태 판단 ── */
function pollerState(){var p=null;try{p=typeof D.poller==='string'?JSON.parse(D.poller):D.poller;}catch(e){}
 if(!p)return {cls:'unk',txt:'신호 없음',p:{}};var a=agoIso(p.updated_at);
 if(a==null)return {cls:'unk',txt:'신호 없음',p:p};if(a>600)return {cls:'bad',txt:'응답 없음',a:a,p:p};if(a>180)return {cls:'warn',txt:'응답 지연',a:a,p:p};return {cls:'ok',txt:'정상',a:a,p:p};}
function connPill(x){if(!x)return pill('unk','미등록');var m={ok:['연결 정상','ok'],pending:['로그인 대기','warn'],fail:['로그인 필요','bad'],none:['미등록','unk']}[x.status]||[x.status,'unk'];return pill(m[1],m[0]);}

/* ── 1. 관제 ── */
function ndHb(cid){var hs=(D.heartbeats||[]).filter(function(h){return (!cid||h.company_id===cid)&&/^newdetect/.test(h.worker);});return hs.find(function(h){return h.worker==='newdetect_tf';})||hs[0];}
function vDash(){
 var cs=D.companies||[],act=cs.filter(function(c){return c.status==='active';});
 var mrr=act.reduce(function(s,c){var f=fee(c);return s+(f?f.month:0);},0);
 var ps=pollerState(),pp=ps.p||{},pr=pp.proc||{},td=pp.today||{};
 var hb=ndHb();
 var h='<h1>관제</h1><p class="subt">모든 업체의 감지·로그인·오늘 처리량을 한 화면에서 봐요. 20초마다 자동으로 새로고침돼요.</p>';
 h+='<div class="grid g4" style="margin-bottom:14px">'+
  kpi('운영 업체',act.length+'곳','전체 등록 '+cs.length+'곳')+
  kpi('관리 기사',D.drivers+'명','팀플렉스 승인 기사 기준')+
  kpi('오늘 팀즈 처리',(td.processed!=null?td.processed:'—')+'건','기사 알림 '+(td.pushed!=null?td.pushed:'—')+'건 발송')+
  kpi('월 예상 구독료',won(mrr),'운영 중 업체 · VAT 별도 · 본사 포함')+'</div>';
 h+='<div class="card" style="margin-bottom:14px"><h3>업체별 상태<span class="r">업체 '+cs.length+'곳</span></h3><div class="tw"><table><thead><tr><th>업체</th><th>요금제</th><th>팀즈 감지</th><th>신선(메타)</th><th>팀즈 로그인</th><th>메타 로그인</th><th>새 감지(병행)</th><th>오늘 인입·요청·공지</th><th>정산</th></tr></thead><tbody>';
 cs.forEach(function(c){
  var own=c.is_owner,cn=by(D.connections,c.id),t=cn.find(function(x){return x.kind==='teams';}),m=cn.find(function(x){return x.kind==='meta';}),sl=by(D.settlement,c.id)[0];
  var st=STAT[c.status]||[c.status,'unk'];
  var hbc=ndHb(c.id);
  h+='<tr><td><div class="st"><b>'+esc(c.name)+(own?' <span class="pill acc">본사</span>':'')+'</b><small>'+esc(c.region||'')+' · '+pill(st[1],st[0])+'</small></div></td>'+

 return h;
}
function brandSrc(){var c=co(SELCO);var b=by(D.branding,c.id)[0]||{};var lp=NEWLOGO||b.logo_path||'';if(lp&&!/^data:|^https?:|^\//.test(lp))lp='/'+lp;return lp;}
function brandPreview(){var el=document.getElementById('b_icons');if(!el)return;var c=co(SELCO);var nm=val('b_name')||c.name,col=val('b_color')||'#3b5bfd',src=brandSrc();
 var ic=function(sz,r,l){return '<div class="icn"><div class="im" style="width:'+sz+'px;height:'+sz+'px;border-radius:'+r+'px;background-color:'+esc(col)+';'+(src?'background-image:url(\''+esc(src)+'\')':'')+'">'+(src?'':esc(nm.slice(0,1)))+'</div>'+l+'</div>';};
 el.innerHTML=ic(60,14,'아이폰 180')+ic(56,28,'안드로이드 192')+ic(88,20,'설치 화면 512');
 var apps=['📞','💬','📷','🗺️','','📅','⚙️','🎵'];
 document.getElementById('b_phone').innerHTML=apps.map(function(a,i){if(i===4)return '<div class="ap"><span style="background-color:'+esc(col)+';'+(src?'background-image:url(\''+esc(src)+'\')':'')+'">'+(src?'':esc(nm.slice(0,1)))+'</span>'+esc(nm.length>7?nm.slice(0,7)+'…':nm)+'</div>';return '<div class="ap"><span>'+a+'</span>앱</div>';}).join('');}
function brandFile(inp){var f=inp.files&&inp.files[0];if(!f)return;if(f.size>8*1024*1024)return toast('8MB 이하 파일을 올려주세요',true);
 var img=new Image();img.onload=function(){var out=null;[512,384,256].some(function(S){var cv=document.createElement('canvas');cv.width=cv.height=S;var x=cv.getContext('2d');var s=Math.min(img.width,img.height);x.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,S,S);out=cv.toDataURL('image/png');return out.length<650000;});
  NEWLOGO=out;URL.revokeObjectURL(img.src);brandPreview();toast('로고를 불러왔어요. 저장을 눌러야 반영돼요');};
 img.onerror=function(){toast('이미지를 읽을 수 없어요',true);};img.src=URL.createObjectURL(f);}
async function saveBrand(){var c=co(SELCO);try{await rpc('qo_admin_set_branding',{p_company:c.id,p_app_name:val('b_name')||null,p_color:val('b_color')||null,p_logo:NEWLOGO});NEWLOGO=null;toast('저장했어요');await load(true);}catch(e){toast('저장 실패: '+e.message,true);}}

/* ── 6. 요금제 ── */
function vPlan(){
 var h='<h1>요금제</h1><p class="subt">금액을 바꾸면 업체 관리의 청구 금액이 바로 다시 계산돼요. (VAT 별도) 카드 연 구독은 <b>N개월 값으로 12개월</b>, 현금 1년도 <b>N개월 값으로 12개월</b>이에요.</p>';
 h+='<div class="grid g3">';
 (D.plans||[]).forEach(function(p){var nf=(D.features||[]).filter(function(f){return !f.is_ops&&!f.is_own&&!f.is_opt&&(f.is_lock||(plan(f.min_plan).rank||99)<=p.rank);}).length;
  var cnt=(D.companies||[]).filter(function(c){return c.plan===p.code;}).length;
  h+='<div class="card"><h3>'+esc(p.name)+'<span class="r">업체 '+cnt+'곳 · 기능 '+nf+'개</span></h3>'+
   fld('이름','<input id="p_n_'+p.code+'" value="'+esc(p.name)+'">')+'<div style="height:8px"></div>'+
   fld('월 요금 (원)','<input id="p_m_'+p.code+'" type="number" step="1000" value="'+p.price_month+'" oninput="planCalc(\''+p.code+'\')">')+'<div style="height:8px"></div>'+
   '<div class="grid g2">'+fld('카드 연 구독 (개월 값)','<input id="p_a_'+p.code+'" type="number" min="1" max="12" value="'+p.annual_months_paid+'" oninput="planCalc(\''+p.code+'\')">')+fld('현금 1년 (개월 값)','<input id="p_c_'+p.code+'" type="number" min="1" max="12" value="'+p.cash_months_paid+'" oninput="planCalc(\''+p.code+'\')">')+'</div>'+
   '<div class="help" style="margin:12px 0" id="p_calc_'+p.code+'"></div><button class="btn pri" onclick="savePlan(\''+p.code+'\')">저장</button></div>';});
 h+='</div><div class="help" style="margin-top:14px">정산 프로그램 단독: 영구 사용 50만 원 · 1주 수정 기간 · 이후 수정 1회 5만 원 · 구독 업체는 초기 세팅 무료 (엑셀 기준)</div>';
 setTimeout(function(){(D.plans||[]).forEach(function(p){planCalc(p.code);});},0);
 return h;
}
function planCalc(c){var m=+val('p_m_'+c)||0,a=+val('p_a_'+c)||0,k=+val('p_c_'+c)||0;var e=document.getElementById('p_calc_'+c);if(e)e.innerHTML='월 결제 <b>'+won(m)+'</b><br>카드 연 구독 <b>'+won(m*a)+'</b> (월 환산 '+won(Math.round(m*a/12))+')<br>현금 1년 <b>'+won(m*k)+'</b> (월 환산 '+won(Math.round(m*k/12))+')';}
async function savePlan(c){var m=parseInt(val('p_m_'+c),10),a=parseInt(val('p_a_'+c),10),k=parseInt(val('p_c_'+c),10);
 if(!(m>0)||!(a>=1&&a<=12)||!(k>=1&&k<=12))return toast('금액과 개월 수를 확인해주세요',true);
 try{await rpc('qo_admin_set_plan',{p_code:c,p_name:val('p_n_'+c),p_price:m,p_annual:a,p_cash:k});toast('요금제를 저장했어요');await load(true);}catch(e){toast('저장 실패: '+e.message,true);}}

/* ── 7. 정산 연동 ── */
function vSetl(){
 var h='<h1>정산 연동</h1><p class="subt">업체마다 정산서를 어떻게 앱에 올릴지 정해요.</p><div class="help"><b>통합 정산</b>: 하나로 통일된 정산 프로그램을 써요. 대표님이 업데이트하면 업체 PC에서 프로그램을 켤 때 자동으로 새 버전이 받아져요.<br><b>결과 파일 연동</b>: 업체가 쓰던 정산 프로그램을 그대로 쓰고, 나온 결과 엑셀만 앱에 올려요 (소원물류처럼 방식이 다른 곳 추천).<br><b>미사용</b>: 정산서 탭을 쓰지 않아요.</div>';
 h+='<div class="card"><div class="tw"><table><thead><tr><th>업체</th><th>연동 방식</th><th>정산 프로그램 라이선스</th><th>마지막 변경</th></tr></thead><tbody>';
 (D.companies||[]).forEach(function(c){var s=by(D.settlement,c.id)[0]||{mode:'none'};
  h+='<tr><td><b>'+esc(c.name)+'</b></td><td><div class="seg">'+[['builtin','통합 정산'],['file','결과 파일 연동'],['none','미사용']].map(function(m){return '<button class="'+(s.mode===m[0]?'on':'')+'" onclick="setSetl(\''+c.id+'\',\''+m[0]+'\','+(!!s.has_license)+')">'+m[1]+'</button>';}).join('')+'</div></td>'+
   '<td><label class="row"><input type="checkbox" '+(s.has_license?'checked':'')+' onchange="setSetl(\''+c.id+'\',\''+s.mode+'\',this.checked)"> 보유</label></td><td class="muted">'+(s.updated_at?new Date(s.updated_at).toLocaleString('ko-KR'):'—')+'</td></tr>';});
 return h+'</tbody></table></div></div>';
}
async function setSetl(id,mode,lic){var c=co(id);if(c.is_owner&&mode!=='builtin'&&!confirm('팀플렉스 정산 연동 방식을 바꿀까요?'))return render();
 try{await rpc('qo_admin_set_settlement',{p_company:id,p_mode:mode,p_license:lic});toast('저장했어요');await load(true);}catch(e){toast('저장 실패: '+e.message,true);}}

/* ── 8. 새 감지 전환 ── */
function vS3(){
 var hb=ndHb(),inf=(hb&&hb.info)||{},cm=inf.cmp||{};
 var h='<h1>새 감지 방식 전환</h1><p class="subt">지금 운영 감지(방을 열어서 화면을 읽는 방식) 옆에서 <b>새 방식(방을 열지 않고 글 번호로 바로 읽는 방식)</b>을 같이 돌리면서 결과를 비교하고 있어요. 새 방식은 지금 <b>읽기만</b> 해서 기사들은 아무것도 느끼지 못해요.</p>';
 h+='<div class="grid g4" style="margin-bottom:14px">'+kpi('새 방식 상태',hb?(hb.age_s<60?'🟢 작동 중':'🟡 신호 늦음'):'—','마지막 신호 '+(hb?ago(hb.age_s):'—'))+kpi('새 방식이 읽은 글',(cm.new_count!=null?cm.new_count:inf.seen||0)+'건','보는 방 '+(inf.rooms||0)+'곳')+kpi('평균 감지 속도',cm.new_avg!=null?cm.new_avg+'초':'집계 중','95%가 '+(cm.new_p95!=null?cm.new_p95+'초':'—')+' 안에 감지')+kpi('새 방식이 놓친 글',cm.prod_only_n!=null?cm.prod_only_n+'건':'집계 중','운영이 처리한 글 중 새 방식이 못 잡은 글')+'</div>';
 h+='<div class="grid g2"><div class="card"><h3>운영과 비교</h3>'+row('운영이 처리 대상으로 잡은 글 (같은 방)',cm.prod_count!=null?cm.prod_count+'건':'—')+row('둘 다 잡은 글',cm.both!=null?cm.both+'건':'—')+row('운영 평균 처리 시점',cm.prod_avg!=null?cm.prod_avg+'초':'—')+row('새 방식 평균',cm.new_avg!=null?cm.new_avg+'초':'—')+row('오류',inf.errs?pill('warn',inf.errs+'회 (자동 재시도)'):pill('ok','0'))+'<p class="muted" style="margin:10px 0 0;line-height:1.6">새 방식은 방의 <b>모든 글</b>을 읽고, 운영은 그중 <b>인입·요청처럼 처리할 글</b>만 기록해요. 그래서 중요한 건 ‘새 방식이 놓친 글 = 0건’이에요. 새 감지는 재시작하면 건수를 0부터 다시 세요.<br>비교 기준 시각 '+esc(cm.at||'—')+'</p></div>';
 h+='<div class="card"><h3>전환 순서</h3><ol class="chk" style="margin:0;padding-left:18px;line-height:1.6">'+
  '<li>✅ 새 방식 병행 시작 (읽기 전용, 시험 계정)</li>'+
    '<li>'+(hb&&hb.worker==="newdetect_tf"?'✅':'⏳')+' 팀플렉스 공식 계정으로 <b>감시하는 방 전체</b> 병행 (여전히 읽기 전용)</li>'+
  '<li>'+(cm.prod_only_n===0&&cm.both>0?'🟡 진행 중':'⏳')+' 놓친 글 0건 확인 (하루 이상)</li>'+
  '<li>⏳ 새 방식이 기사 알림·팀즈 답글 담당 → 기존 방식은 5분 간격 <b>예비</b>로 남김</li>'+
  '<li>⏳ 일주일 이상 문제없으면 기존 방식 정리</li></ol>'+
  '<div class="help" style="margin:12px 0 0">문제가 생기면 언제든 <b>기존 방식이 그대로 담당</b>하도록 되돌려요. 기존 방식은 전환이 끝날 때까지 꺼지지 않아요.</div></div></div>';
 return h;
}

/* ── 9. 변경 기록 ── */
function vLog(){
 var h='<h1>변경 기록</h1><p class="subt">QUICKOPS에서 바꾼 모든 내용이 남아요. (비밀번호는 기록되지 않아요)</p><div class="card"><div class="tw"><table><thead><tr><th>시각</th><th>누가</th><th>업체</th><th>무엇을</th><th>내용</th></tr></thead><tbody>';
 (D.audit||[]).forEach(function(a){var c=co(a.company_id);h+='<tr><td class="mono" style="white-space:nowrap">'+new Date(a.at).toLocaleString('ko-KR')+'</td><td>'+esc(a.actor)+'</td><td>'+esc(c?c.name:(a.company_id||'전체'))+'</td><td><b>'+esc(a.action)+'</b></td><td class="muted" style="max-width:520px;word-break:break-all">'+esc(a.detail)+'</td></tr>';});
 return h+'</tbody></table></div></div>';
}
boot();
