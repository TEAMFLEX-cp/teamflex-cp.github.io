<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>나사 정리</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;
    background:linear-gradient(180deg,#3b4152,#20232f);color:#fff;overflow:hidden}
  #app{max-width:460px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:10px 12px 14px}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .title{font-size:21px;font-weight:800}
  .coins{background:rgba(255,255,255,.13);padding:5px 12px;border-radius:16px;font-weight:700;font-size:14px}
  .stats{display:flex;gap:8px;justify-content:center;margin-bottom:8px}
  .pill{background:rgba(255,255,255,.12);padding:5px 14px;border-radius:15px;font-size:13px;font-weight:700;color:#d5dae6}
  #board{flex:1;background:#474e63;border:2px solid #2b3040;border-radius:14px;margin:0 2px 12px;padding:12px;
    display:flex;flex-wrap:wrap;align-content:flex-start;justify-content:center;gap:9px;overflow:auto}
  .screw{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 38% 30%,#f2f4f8,#b6bdcd 55%,#7d859a);
    display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;transition:transform .1s}
  .screw:active{transform:scale(.9)}
  .screw .core{width:26px;height:26px;border-radius:50%;position:relative}
  .screw .core::before,.screw .core::after{content:"";position:absolute;background:rgba(0,0,0,.45);border-radius:2px}
  .screw .core::before{left:5px;right:5px;top:11px;height:3px}
  .screw .core::after{top:5px;bottom:5px;left:11px;width:3px}
  #bins{display:flex;gap:8px;justify-content:center;padding:0 2px}
  .bin{flex:1;max-width:80px;height:120px;border-radius:12px;background:#2a2f3d;border:2px dashed #565d70;
    display:flex;flex-direction:column-reverse;align-items:center;padding:6px 0;gap:4px}
  .bin.filled{border-style:solid}
  .bslot{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 38% 30%,#f2f4f8,#b6bdcd 55%,#7d859a);position:relative}
  .bslot .c{width:18px;height:18px;border-radius:50%;position:absolute;top:4px;left:4px}
  .ctrl{display:flex;gap:10px;justify-content:center;margin-top:10px}
  .btn{padding:11px 22px;border:none;border-radius:14px;font-size:14px;font-weight:800;color:#fff;cursor:pointer;
    background:linear-gradient(180deg,#6b7180,#454b59);box-shadow:0 4px 0 #333844}
  .btn:active{transform:translateY(2px);box-shadow:0 2px 0 #333844}
  .ov{position:fixed;inset:0;background:rgba(15,17,25,.78);display:none;align-items:center;justify-content:center;z-index:20;backdrop-filter:blur(3px)}
  .ov.show{display:flex}
  .card{background:linear-gradient(180deg,#3b4152,#282d3a);border:1.5px solid rgba(255,255,255,.18);border-radius:24px;
    padding:26px 24px;text-align:center;width:80%;max-width:320px}
  .card h2{margin:8px 0 4px;font-size:25px}.card p{margin:2px 0 16px;color:#c6cdda}
</style>
</head>
<body>
<div id="app">
  <div class="top"><div class="title">🔩 나사 정리</div><div class="coins">🪙 <span id="coin">0</span></div></div>
  <div class="stats"><div class="pill">Lv. <span id="lv">1</span></div><div class="pill">남은나사 <span id="left">0</span></div></div>
  <div id="board"></div>
  <div id="bins"></div>
  <div class="ctrl"><button class="btn" onclick="build(stage);render();">🔄 다시</button></div>
</div>
<div class="ov" id="ov"><div class="card"><div id="ovi" style="font-size:44px">🎉</div><h2 id="ovh">클리어!</h2><p id="ovp"></p><button class="btn" id="ovb" onclick="ovAct()">다음 ▶</button></div></div>
<script>
var PAL=['#ff5a63','#4a86ff','#34d17a','#ffc62e','#a463ff','#ff8a3d'];
var CAP=3,BINS=5;
var board,bins,stage,coin,K,over;
try{coin=parseInt(localStorage.getItem('sp_coin')||'0')||0;stage=parseInt(localStorage.getItem('sp_stage')||'1')||1;}catch(e){coin=0;stage=1;}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}}
function build(s){
  K=Math.min(3+Math.floor((s-1)/8),6);
  var groups=Math.min(2+Math.floor((s-1)/12),4);
  board=[];for(var k=0;k<K;k++)for(var g=0;g<groups*CAP;g++)board.push(k);
  shuffle(board);
  bins=[];for(var b=0;b<BINS;b++)bins.push({c:-1,n:0});
  over=false;
}
function render(){
  document.getElementById('lv').textContent=stage;
  document.getElementById('left').textContent=board.length;
  document.getElementById('coin').textContent=coin;
  var bd=document.getElementById('board');bd.innerHTML='';
  board.forEach(function(col,i){
    var s=document.createElement('div');s.className='screw';
    var c=document.createElement('div');c.className='core';c.style.background='radial-gradient(circle at 35% 28%,rgba(255,255,255,.7),rgba(255,255,255,0) 42%),'+PAL[col];
    s.appendChild(c);s.onclick=(function(idx){return function(){tap(idx);};})(i);bd.appendChild(s);
  });
  var bn=document.getElementById('bins');bn.innerHTML='';
  bins.forEach(function(b){
    var d=document.createElement('div');d.className='bin'+(b.c>=0?' filled':'');
    if(b.c>=0)d.style.borderColor=PAL[b.c];
    for(var j=0;j<b.n;j++){var sl=document.createElement('div');sl.className='bslot';var cc=document.createElement('div');cc.className='c';cc.style.background='radial-gradient(circle at 35% 28%,rgba(255,255,255,.7),rgba(255,255,255,0) 42%),'+PAL[b.c];sl.appendChild(cc);d.appendChild(sl);}
    bn.appendChild(d);
  });
}
function findBin(col){
  for(var i=0;i<bins.length;i++)if(bins[i].c===col&&bins[i].n<CAP)return i;
  for(var j=0;j<bins.length;j++)if(bins[j].c<0)return j;
  return -1;
}
function tap(idx){
  if(over)return;
  var col=board[idx];var bi=findBin(col);
  if(bi<0){var el=document.getElementById('board').children[idx];if(el){el.style.transform='translateX(4px)';setTimeout(function(){el.style.transform='';},120);}return;}
  board.splice(idx,1);
  bins[bi].c=col;bins[bi].n++;
  if(bins[bi].n>=CAP){bins[bi]={c:-1,n:0};coin+=3;try{localStorage.setItem('sp_coin',coin);}catch(e){}}
  render();
  if(board.length===0){setTimeout(winStage,220);return;}
  // 막힘 체크: 남은 나사 중 놓을 수 있는 게 하나도 없으면 게임오버
  var stuck=board.every(function(c){return findBin(c)<0;});
  if(stuck)setTimeout(gameOver,220);
}
function winStage(){over=true;coin+=10+stage;try{localStorage.setItem('sp_coin',coin);localStorage.setItem('sp_stage',stage+1);}catch(e){}
  try{if(window.parent!==window)parent.postMessage({type:'ghscore',game:'screwsort',score:stage},'*');}catch(e){}
  document.getElementById('ovi').textContent='🎉';document.getElementById('ovh').textContent='클리어!';document.getElementById('ovp').textContent='Lv.'+stage+' 완료 · +'+(10+stage)+' 🪙';document.getElementById('ovb').textContent='다음 ▶';document.getElementById('ov').className='ov show';}
function gameOver(){over=true;document.getElementById('ovi').textContent='😵';document.getElementById('ovh').textContent='막혔어요!';document.getElementById('ovp').textContent='정리판이 꽉 찼어요. 순서를 바꿔보세요';document.getElementById('ovb').textContent='다시 하기 ▶';document.getElementById('ov').className='ov show';}
function ovAct(){var won=document.getElementById('ovh').textContent==='클리어!';document.getElementById('ov').className='ov';if(won)stage++;build(stage);render();}
build(stage);render();
</script>
</body>
</html>
